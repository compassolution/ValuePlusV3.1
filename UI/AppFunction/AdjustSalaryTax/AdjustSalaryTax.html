    <!-- 模态框（Modal） -->

    <script type="text/javascript">
        function showNewOpenWindow(url) {
            var randamNum = (Math.floor((Math.random() * 100) + 1)).toString();//100之内的随机数,可同时打开多个动作页面
            window.open(url, 'AdjustTaxList' + randamNum, 'left=0,top=0,width=' + (screen.availWidth - 10) + ',height=' + (screen.availHeight - 50) + ',scrollbars,resizable=yes,toolbar=no,location=no');
        }
        function showOpenDialogPage(url) {
            var randamNum = (Math.floor((Math.random() * 100) + 1)).toString();//100之内的随机数,可同时打开多个动作页面
            window.showModalDialog(url, 'AdjustTaxList' + randamNum, 'left:0;top:0;dialogWidth:' + (screen.availWidth - 10) + ';dialogHeight:' + (screen.availHeight - 50) + ';resizable:yes;toolbar:no;location:no');
        }
        function ShowWaitting() {
            if ($('body').hasClass('modal-open')) {
                //modal已打开
            } else {
                //modal没有打开
                $('#myWaittingModal').modal();
            }
        }
        function HideWaitting() {
            if ($('body').hasClass('modal-open')) {
                //modal已打开
                $('#myWaittingModal').modal('hide');
            } else {
                //modal没有打开
            }
        }
        //提示框闪现
        function ShowAndHideNotice(showDesc, isHide, sec) {
            ShowWaitting();
            $("#myWaittingModalContent").html(showDesc);
            if (isHide) {
                setTimeout(function () {
                    $("#myWaittingModalContent").html("");
                    HideWaitting();
                }, sec);
            }
        }
        //判断是否登录
        function JudgeIsLogin() {
            var urlQuery = escape("M=" + Math.random());
            var url = "AdjustSalaryTax.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == '-9999') {
                        ShowAndHideNotice('您尚未登录，请登录后重试！', false, 0);
                    } else {
                        ///加载计税年度下拉框
                        LoadTaxYearList();
                    }
                }
            })
        }
    </script>

    <script type="text/javascript">
        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            $("#txt_ModifyData").val("");
            $("#myWaittingModalContent").html("");
            $("#sel_StaffNo").empty();
            $("#sel_StaffNo").append("<option value=''>选择员工</option>");

            //判断是否登录
            JudgeIsLogin();
            
            ///年度下拉框切换事件
            $('#sel_TaxYear').on('change', function () {
                LoadStaffList($('#sel_TaxYear').val());
            });
            //员工列表切换事件
            $('#sel_StaffNo').on('change', function () {
                ShowWaitting();
                setTimeout(function () {
                    GetAndSetListResult($('#sel_TaxYear').val(), $('#sel_StaffNo').val());
                }, 100);
            });

            ///保存操作
            $('#btnSave').click(function () {
                ShowWaitting();
                setTimeout(function () {
                    SaveModifyTaxData();
                }, 100);
            });
            ///重新计算操作
            $('#btnCalculate').click(function () {
                ShowWaitting();
                setTimeout(function () {
                    CalculateTaxData();
                }, 100);
            });
            ///重新计算操作
            $('#btnShowHistory').click(function () {
                var url = "../../Archive/Archive.aspx?DOCU=AdjustTaxData";
                showNewOpenWindow(url);
            });

        });

    </script>

    <!--加载下拉框-->
    <script type="text/javascript">
        ///加载计税年度下拉框
        function LoadTaxYearList() {
            var urlQuery = escape("M=" + Math.random() + "&param=taxyearlist");
            var url = "AdjustSalaryTax.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);
                    if (dataobj.ResultData == "") return false;

                    //加载下拉列表sel_TaxYear
                    $("#sel_TaxYear").empty();
                    $("#sel_TaxYear").append("<option value=''>" + "选择计税年度" + "</option>");
                    $.each(dataobj.ResultData, function (idx, item) {
                        var showName = unescape(item.ISNOW) == '1' ? unescape(item.TaxYear) + "(当前年度)" : unescape(item.TaxYear);
                        $("#sel_TaxYear").append("<option value='" + item.TaxYear + "'>" + showName + "</option>");
                    });
                }
            });
            $("#sel_TaxYear").selectpicker('refresh');
        }

        ///加载员工列表下拉框
        function LoadStaffList(curTaxYear) {
            $("#sel_StaffNo").empty();
            $("#sel_StaffNo").append("<option value=''>选择员工</option>");
            var urlQuery = escape("M=" + Math.random() + "&param=stafflist" + "&taxyear=" + curTaxYear);
            var url = "AdjustSalaryTax.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);
                    if (dataobj.ResultData == "") return false;

                    //加载下拉列表sel_StaffNo
                    $.each(dataobj.ResultData, function (idx, item) {
                        var showName = "(" + unescape(item.DCNO) + ")" + unescape(item.DCNAMECHS);
                        //alert(showName);
                        $("#sel_StaffNo").append("<option value='" + unescape(item.DCNO) + "'>" + showName + "</option>");
                    });
                }
            });
            $("#sel_StaffNo").selectpicker('refresh');
        }
    </script>

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载某计税年度月份下的员工列表数据列表
        function GetAndSetListResult(varTaxYear,varStaffNo) {
            $("#lb_NoticeMsg").text('').hide();
            $("#txt_ModifyData").val("");
            var strParam = "taxyear=" + varTaxYear + "&dcno=" + varStaffNo;
            var urlQuery = escape("M=" + Math.random() + "&param=stafftaxdata&" + strParam);
            var url = "AdjustSalaryTax.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        HideWaitting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];

                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                            //创建列
                            if (i == 0) {
                                if ("项目名称 ".indexOf(key) > -1) {
                                    columns.push({
                                        field: key,
                                        title: key,
                                        width: "280",
                                        sortable: false,
                                        clicktoselect: true,
                                        visible: true,
                                        order: "desc"
                                    });
                                }
                                else if ("计税年度;员工编号;员工姓名;入职日期;项目编号 ".indexOf(key) > -1) {
                                    columns.push({
                                        field: key,
                                        title: key,
                                        sortable: false,
                                        clicktoselect: true,
                                        visible: false,
                                        order: "desc"
                                    });
                                } else {//月度列
                                    columns.push({
                                        field: key,
                                        title: key,
                                        sortable: false,
                                        clicktoselect: true,
                                        visible: true,
                                        editable: {
                                            type: 'text',//编辑框的类型。支持text|textarea|select|date|checklist等
                                            emptytext: "-",
                                            noeditFormatter: function (value, row, index) {//noeditFormatter属性返回false可屏蔽当前设置，返回其他即作为单元格输出样式
                                                var RowData = JSON.parse(JSON.stringify(row));
                                                var ItemCode = RowData.项目编号;
                                                switch (ItemCode) {
                                                    case "MonthIncome"://当月收入额
                                                    case "MonthDeduct_GSQZD"://当月扣除(个税起征点)
                                                    case "MonthDeduct_Other"://当月扣除(其他)
                                                    case "MonthDeduct_ZXFJ_ZNJY"://当月专项附加扣除(子女教育)"://60'
                                                    case "MonthDeduct_ZXFJ_JXJY"://当月专项附加扣除(继续教育)"://70'
                                                    case "MonthDeduct_ZXFJ_DBYL"://当月专项附加扣除(大病医疗)"://80'
                                                    case "MonthDeduct_ZXFJ_SYLR"://当月专项附加扣除(赡养老人)"://90'
                                                    case "MonthDeduct_ZXFJ_ZFZJ"://当月专项附加扣除(住房租金)"://100'
                                                    case "MonthDeduct_ZXFJ_ZFDKLX"://当月专项附加扣除(住房贷款利息)','110'
                                                        if (value == '') {
                                                            return value;
                                                        } else {
                                                            return false;
                                                        }
                                                        break;
                                                    default:
                                                        return value;
                                                        break;
                                                }
                                            },
                                            validate: function (value) {
                                                if ($.trim(value) == '') {
                                                    return '不能为空!';
                                                } else {
                                                    //校验为数值
                                                    var pattern = /^([-]){0,1}([0-9]){1,}([.]){0,1}([0-9]){0,}$/;
                                                    var flag = pattern.test($.trim(value));
                                                    if (!flag) {
                                                        return '必须为数值型!';
                                                    }
                                                }
                                            }
                                        },
                                        order: "desc"
                                    });
                                }
                            }
                        }
                        data.push(row);
                    }
                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        exportTypes: ['json', 'xml', 'csv', 'txt', 'sql', 'excel', 'pdf'],
                        onEditableSave: function (field, row, oldValue, $el) {//注册编辑框保存事件
                            //var RowData = JSON.parse(JSON.stringify(row));
                            //alert('字段:'+field);
                            //alert('员工编号:' + row.员工编号);
                            //alert('员工姓名:' + row.员工姓名);
                            //alert('项目编号:' + row.项目编号);
                            //alert('项目名称:' + row.项目名称);
                            //alert('修改前值:' + $el);
                            //alert('修改后值:' + row[field]);
                            //拼接字符串到后台，格式为:计税年度+薪资月份+员工编号+项目编号+更新前旧值+更新后新值+项目名称
                            var ModifyString = $('#sel_TaxYear').val() + "+" + field + "+" + $('#sel_StaffNo').val() + "+" + row.项目编号 + "+" + $el + "+" + row[field] + "+" + row.员工姓名 + "+" + row.项目名称;
                            if ($("#txt_ModifyData").val() == '') {
                                $("#txt_ModifyData").val(ModifyString);
                            } else {
                                $("#txt_ModifyData").val($("#txt_ModifyData").val()+"；"+ModifyString);
                            }
                        },
                        onPostHeader: function(){
                            $('#tbListTable')[0].find('tr th').css('background', 'red');
                        },
                        columns: columns,
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    HideWaitting();
                }
            });

            HideWaitting();
        }

        //表格行样式
        function TableRowStyle(row, index) {
            var classes = ['active', 'success', 'info'];
            return {
                classes: classes[index % 3]
            };
        }

        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

    </script>


    <!--保存操作-->
    <script type="text/javascript">
        ///保存数据
        function SaveModifyTaxData() {
            if ($('#sel_TaxYear').val() == '' || $('#sel_StaffNo').val() == '') {
                ShowAndHideNotice("请先选择计税年度及员工后重试!", true, 2000);
            } else {
                if ($("#txt_ModifyData").val() == '') {
                    ShowAndHideNotice("未做任何修改，无需保存!", true, 2000);
                }
                else {
                    var urlQuery = escape("M=" + Math.random() + "&param=savetaxdata");
                    var url = "AdjustSalaryTax.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        type: "POST",
                        url: url,
                        async: false,
                        data: $('#formList').serialize(), // 你的formid
                        error: function (request) {
                            HideWaitting();
                        },
                        success: function (data) {
                            //alert(data);
                            //HideWaitting();
                            if (data < "0") {
                                ShowAndHideNotice("保存操作失败，请联系管理员处理!", true, 2000);
                            } else {
                                ShowAndHideNotice("保存操作成功，如修改完毕请执行重新计算操作!", true, 2000);
                            }

                        }
                    });
                }
            }
        }
    </script>

    <!--重新计算操作-->
    <script type="text/javascript">
        ///重新计算操作
        function CalculateTaxData() {
            if ($('#sel_TaxYear').val() == '' || $('#sel_StaffNo').val() == '') {
                ShowAndHideNotice("请先选择计税年度及员工后重试!", true, 2000);
            }
            else {
                var urlQuery = escape("M=" + Math.random() + "&param=calculatetaxdata");
                var url = "AdjustSalaryTax.ashx?" + urlQuery;
                $.ajax({
                    cache: false,
                    type: "POST",
                    url: url,
                    async: false,
                    data: $('#formList').serialize(), // 你的formid
                    error: function (request) {
                        HideWaitting();
                    },
                    success: function (data) {
                        //alert(data);
                        HideWaitting();
                        if (data < "0") {
                            ShowAndHideNotice("重新计算个税操作失败，请联系管理员处理!", true, 2000);
                        } else {
                            ShowAndHideNotice("重新计算个税操作操作成功，将重新加载数据列表!", true, 1000);
                            setTimeout(function () {
                                GetAndSetListResult($('#sel_TaxYear').val(), $('#sel_StaffNo').val());
                            }, 100);
                        }

                    }
                });
            }
        }
    </script>
