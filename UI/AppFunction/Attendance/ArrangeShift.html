        /*侧边栏modal样式*/
        .modalSidebar.left .modal-dialog, .modal.right .modal-dialog {
            position: fixed;
            margin: auto;
            width: 410px;
            height: 100%;
            -webkit-transform: translate3d(0,0,0);
            -ms-transform: translate3d(0,0,0);
            -o-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0)
        }
        .modalSidebar.left .modal-content, .modal.right .modal-content {
            height: 100%;
            overflow-y: auto
        }
        .modalSidebar.left .modal-body, .modal.right .modal-body {
            padding: 15px 15px 80px
        }
        .modalSidebar.left.fade .modal-dialog {
            left: -410px;
            -webkit-transition: opacity .3s linear,left .3s ease-out;
            -moz-transition: opacity .3s linear,left .3s ease-out;
            -o-transition: opacity .3s linear,left .3s ease-out;
            transition: opacity .3s linear,left .3s ease-out
        }
        .modalSidebar.left.fade.in .modal-dialog {
            left: 0
        }
        .modalSidebar.right.fade .modal-dialog {
            right: -410px;
            -webkit-transition: opacity .3s linear,right .3s ease-out;
            -moz-transition: opacity .3s linear,right .3s ease-out;
            -o-transition: opacity .3s linear,right .3s ease-out;
            transition: opacity .3s linear,right .3s ease-out
        }
        .modalSidebar.right.fade.in .modal-dialog {
            right: 0
        }
        .modalSidebar .modal-content {
            border-radius: 0;
            border: none
        }
        .modalSidebar .modal-header {
            border-bottom-color: #eee;
            background-color: #fafafa
        }
        /*侧边栏modal样式*/

        /*全屏modal样式*/
        .modalFullScreen .modal-dialog {

            margin: auto;
            width: 100%;
            height: 100%;

        }
        .modalFullScreen .modal-content {

            overflow-y: auto

        .modalFullScreen .modal-content {
            border-radius: 0;
            border: none
        }
        /*全屏modal样式*/

    <script type="text/javascript">
        //全局变量
        var screenWidth = screen.availWidth;
        var screenHeight = screen.availHeight;

        function ShowWaitting() {
            $('#myWaittingModalTitle').html('正在处理中,请稍候.....');
            $('#myWaittingModalContent').html('');
            $('#myWaittingModal').modal();
            $('#btnCloseWaittingModal').hide();
        }
        function HideWaitting() {
            $('#myWaittingModal').modal('hide');
        }

        function ShowWaittingAndTips() {
            $('#myWaittingModal').modal();
            $('#btnCloseWaittingModal').hide();
        }

        function ShowOpenFullDialog(url, name) {
            //var varWidth = screen.availWidth;
            //var varHeight = screen.availHeight;
            //window.open(url, url, 'width=' + varWidth + ',height=' + varHeight + ',top=0,left=0, center:1, toolbar=no, menubar=no, scrollbars=yes,resizable=yes,location=no, status=no');
            //alert($('.modalFullScreen').height());
            //alert(screenHeight);

            //判断是否有parent窗口，即是否从审核窗口进入，如果是则全屏modal框在parent窗口打开，否则在本月modal框打开
            if ($("#sel_InchargeUserId", window.parent.document).attr("id") == 'sel_InchargeUserId') {
                $('#frameFullScreenPage', window.parent.document).attr("src", url);
                $('#frameFullScreenPage', window.parent.document).height($('.modalFullScreen', window.parent.document).height() - 90);
                $('#myFullModalHeaderLabel', window.parent.document).html(name);
                $(".modalFullScreen", window.parent.document).modal();
            } else {
                $('#frameFullScreenPage').attr("src", url);
                $('#frameFullScreenPage').height($('.modalFullScreen').height() - 90);
                $('#myFullModalHeaderLabel').html(name);
                $(".modalFullScreen").modal();
            }
        }
        function OpenOrigWindow(url, flag, isReresh, IsAnalyse) {
            var varWidth = screen.availWidth - 60;
            var varHeight = screen.availHeight - 200;
            var newPage = window.open(url, flag, 'width=' + varWidth + ',height=' + varHeight + ',top=100,left=20, center:1, toolbar=no, menubar=no, scrollbars=yes,resizable=yes,location=no, status=no');

            ////监听弹窗页面的关闭事件
            var loop = setInterval(() => {
                if (newPage.closed) {
                    clearInterval(loop);
                    if (IsAnalyse) {//如果需要分析考勤
                        $("#btnAnalyseResult").click();
                    }else if (isReresh) {//如果需要刷新页面
                        $("#btnLoadStaffList").click();
                    }
                }
            });
        }

        $('.modalFullScreen').on('hide.bs.modal', function () {
            if ($("#sel_InchargeUserId", window.parent.document).attr("id") == 'sel_InchargeUserId') {
                $('#frameFullScreenPage', window.parent.document).attr("src", "");
                $('#myFullModalHeaderLabel', window.parent.document).html("");
            } else {
                $('#frameFullScreenPage').attr("src", "");
                $('#myFullModalHeaderLabel').html("");
            }
        });


    </script>
    <script type="text/javascript">
        //弹出框的实例化
        var Ealt = new Eject();
        //页面传递参数
        var varPostSectionUserId = GetUrlQueryString("sectionuserid");
        var varPostYearMonth = GetUrlQueryString("yearmonth");
        var varPostUserType = GetUrlQueryString("usertype");//0或者空为小部门用户,1为人事部审核
        if (varPostSectionUserId == null || varPostSectionUserId == 'null') { varPostSectionUserId = ''; }
        if (varPostYearMonth == null || varPostYearMonth == 'null') { varPostYearMonth = ''; }
        if (varPostUserType == null || varPostUserType == 'null') { varPostUserType = ''; }

        var varLoginUserId = "";//当前的登录账号


        //当前考勤期间信息
        var varCurYearMonth = "";
        var varCurYearMonthDateFrom = "";
        var varCurYearMonthDateTo = "";
        var varCurYearMonthIsLock = "";
        //班次表对象
        var table_ShiftList;
        //员工每日排班表对象
        var table_StaffList;
        //员工某天考勤结果表
        var table_ResultList;
        //员工每日排班表固定列的个数
        var fixedColumnCount_StaffList;
        //当前期间当前考勤员的排班状态编码
        var varKQSTATUS = "1";
        //当前期间当前考勤员的排班状态描述
        var varKQSTATUSDesc = "";
        //是否可操作页面数据[0不可操作，1可操作]--不可操作时不能保存排班不能分析，不能修改考勤结果
        var IsCanDealData = "1";
        //员工号与行号的对应关系json
        var jsonData_DCNO_RowIndex = new Hashtable();
        //员工列表行数据
        var data_Row_StaffList = [];
        var data_Row_StaffList_DCNO = [];//仅DCNO的数组
        //员工列表列数据
        var data_Column_StaffList = [];
        var data_LockedDateList = [];
        //周锁定时是否锁定当前部门（1为是，0为否针对所有部门） add by sammen 20260209
        var IsLockWeekForCurSection = "0";

        ////【某员工某日考勤结果获取对象】
        //某员工某日考勤结行数据
        var data_DataJson_ResultList = {};
        //某员工某日考勤结行数据
        var data_Row_ResultList = [];
        //某员工某日考勤结行数据【主显示列-json对象中key为列显示Title的数据数组】
        var data_Row_ResultList_IsShowList = [];
        //某员工某日考勤结行数据【主显示列-json对象中key为字段名ColName的数据数组】
        var data_Row_ResultList_ColumnName_IsShowList = [];
        //某员工某日考勤结列数据
        var data_Column_ResultList = [];
        //某员工某日考勤结列数据【主显示列】
        var data_Column_ResultList_IsShowList = [];
        ////【某员工某日考勤结果获取对象】

        //IsShowStillUnNormal是否显示依然为异常的，否则显示调整为正常的【1/0】
        var IsShowStillUnNormal = '1';
        //当前也可选择的班次数组
        var validShiftArrary = []
        //当前页面Cell数据改变的个数
        var iChangedCellValue = 0;
        //当前页面Cell数据改变的数据hashtable
        var changedCellHashTable = new Hashtable();
        //当前页面Cell数据改变的数据Json
        var changedCellJsonData = [];
        var origValuedata_Row_StaffList = {};

        //当前期间被锁定的人天 add by sammen 20210914
        var lockedStaffDateArrary = []

        //所有被锁定的年月期间 add by sammen 20221122
        var yearMonthLockedArrary = [];
        //当前期间所有被锁定的日期 add by sammen 20221122
        var dateLockedArrary = []

        $(function () {
            ShowWaitting();
            $("#sel_YearMonth").hide();
            //加载考勤期间列表信息
            LoadYearMonthToSelect();
            //加班班次列表
            LoadShiftListToSheet();
            setTimeout(function () {
                //根据期间更新本月需做考勤的人员列表并加载员工列表sheet表格信息
                UpdateStaffListByYearMonth();
                HideWaitting();
            }, 100);
            ///期间下拉框切换事件
            $('#sel_YearMonth').change(function () {
                ShowWaitting();
                //切换选择某月份期间
                ChangeYearMonth();

                setTimeout(function () {
                    //根据期间更新本月需做考勤的人员列表并加载员工列表sheet表格信息
                    UpdateStaffListByYearMonth();
                    HideWaitting();
                }, 100);
            });

            $("#btnSwitchException").click(function () {
                ///切换显示异常考勤结果信息数据
                LoadUnNormalData();
            });
            $("#btnLoadStaffList").click(function () {
                $('#divArea_ResultList').hide();
                $('#spanCurStaffNo').html('');
                $('#spanCurDay').html('');
                $('#spanIsModify').html('0')

                ///重新加载排班数据
                ShowWaitting();
                LoadStaffListToSheet("");
            });
            $("#btnSaveShift").click(function () {
                ShowWaitting(); 
                ///add by sammen 20221122 防止HR审核后考勤员未及时刷新，实时获取被锁定的年月期间
                GetLockedYearMonth();
                ///add by sammen 20221122 防止HR审核后考勤员未及时刷新，实时获取是否可以分析的状态
                LoadDeptListAndLockFlag();
                if (IsCanDealData == '0') {
                    Ealt.Etoast('期间锁定或者审核状态时无法操作', 2)   //默认三秒
                    HideWaitting();
                } else {
                    if (changedCellHashTable.count() <= 0) {
                        HideWaitting();
                        Ealt.Etoast('未变更排班，无需保存', 1)   //默认三秒
                        //alert("未变更排班，无需保存");
                        return false
                    } else {
                        setTimeout(function () {
                            ///保存排班数据
                            SaveStaffShiftData();
                        }, 200)
                    }
                }
            });
            $("#btnAnalyseResult").click(function () {
                ShowWaitting(); 
                ///add by sammen 20221122 防止HR审核后考勤员未及时刷新，实时获取被锁定的年月期间
                GetLockedYearMonth();
                ///add by sammen 20221122 防止HR审核后考勤员未及时刷新，实时获取是否可以分析的状态
                LoadDeptListAndLockFlag();
                setTimeout(function () {
                    //console.log('考勤分析时IsCanDealData=', IsCanDealData);
                    if (IsCanDealData == '0') {
                        Ealt.Etoast('期间锁定或者审核状态时无法操作', 2)   //默认三秒
                        HideWaitting();
                    } else {
                        ///分析考勤结果
                        DoAnalyseInit();
                    }
                }, 200)
            });
            $('#btnCloseWaittingModal').click(function () {
                //重新加载排班表
                $("#btnLoadStaffList").click();
                HideWaitting();
            })
            $("#btnMultiAdjustResult").click(function () {
                if (IsCanDealData == '0') {
                    Ealt.Etoast('期间锁定或者审核状态时无法操作', 2)   //默认三秒
                } else {
                    var url = "MultiAdjustResult.html?SP=USP_HR_QRY_KQ_AnalyseRecord&yearmonth=" + $("#sel_YearMonth").val()
                        + "&sectionuserid=" + varPostSectionUserId
                        + "&iscandealdata=" + IsCanDealData
                        //+ "&stafflist=" + encodeURIComponent(JSON.stringify(data_Row_StaffList_DCNO))
                        + "&lockeddatelist=" + encodeURIComponent(JSON.stringify(data_LockedDateList));
                    OpenOrigWindow(url, '批量调整异常考勤结果', false, false);

        ///显示异常考勤结果信息数据
        function LoadUnNormalData() {
            var yearMonth = $("#sel_YearMonth").val();

            urlQuery = escape(urlQuery);

            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    $("#console").val(data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");
                    //alert(dataJson.ResultData);
                    var resultArray = dataJson.ReturnRowData;

                    //console.log('LoadUnNormalData。resultArray:', resultArray);

                    //遍历数组
                    $.each(resultArray, function (n, value) {
                        var varSSTAFFNO = value.SSTAFFNO;
                        var varDay = value.SDAY;//本周期第几天
                        var unNormalStateStr = value.SSTATE;
                        //console.log('value:', value);

                        //根据工号获取行号x
                        var x = jsonData_DCNO_RowIndex.items(varSSTAFFNO);
                        //根据异常日期index获取列码
                        var colChar = createCellPos(parseInt(varDay) - 1 + parseInt(fixedColumnCount_StaffList));
                        //获取sheet中cell的位置
                        var cellName = colChar + (x + 1).toString();

                        //if (varSSTAFFNO == '30203210') {
                        //    console.log('varSSTAFFNO:', varSSTAFFNO + "--" + cellName);
                        //}

                        var uIndex = unNormalStateStr.indexOf('@');
                        var unNormalState = unNormalStateStr.substring(0, 1);
                        var unNormalStatetype = unNormalStateStr.substring(uIndex + 1, unNormalStateStr.length);

                        /*//unNormalState = [2异常 / 1调整为正常]*/
                        if (unNormalState == '2'
                            || (unNormalState == '1' && IsShowStillUnNormal == "1")) {
                            //    //异常状态,或者调整成正常后想切换显示异常状态时
                            //    //用不同的颜色显示考勤异常
                            //if (varSSTAFFNO=='00037'){
                            //alert(varSSTAFFNO+' U '+x);
                            //alert(unNormalStatetype.indexOf('#'))
                            //}
                            if (unNormalStatetype == '*') {
                                table_StaffList.setStyle(cellName, 'background-color', '#009900');
                            } else if (unNormalStatetype == 'LE') {
                                table_StaffList.setStyle(cellName, 'background-color', '#ff00ff');
                            } else if (unNormalStatetype == 'LELE') {
                                table_StaffList.setStyle(cellName, 'background-color', '#ff00ff');
                            } else if (unNormalStatetype == '!AW') {
                                table_StaffList.setStyle(cellName, 'background-color', '#00ee99');
                            } else if (unNormalStatetype == '!?') {
                                table_StaffList.setStyle(cellName, 'background-color', '#0099ff');
                            } else if (unNormalStatetype == '*LE') {
                                table_StaffList.setStyle(cellName, 'background-color', '#ffaa22');
                            } else if (unNormalStatetype.indexOf('#') > 0) {
                                table_StaffList.setStyle(cellName, 'background-color', '#9aacd2');
                            } else {
                                table_StaffList.setStyle(cellName, 'background-color', '#ff0000');
                            }
                        } else {
                            //调整成正常后显示黄色
                            table_StaffList.setStyle(cellName, 'background-color', 'yellow');
                        }
                        //alert(table_StaffList.getStyle("AJ3"));
                    });
                    //切换标志位
                    IsShowStillUnNormal = IsShowStillUnNormal == '1' ? '0' : '1';

                }
            });
        }

                        case 'SREMARK':
                            item.width = parseFloat(widthRemark);

                        case 'EXCEPTIONCHS':
                            item.width = parseFloat(widthExceptionChs);

            //console.log('tempShow_data_Row_ResultList_ColName_Json：', tempShow_data_Row_ResultList_ColName_Json);
            //组成json对象中key为字段名的数据数组
            data_Row_ResultList_ColumnName_IsShowList = []
            data_Row_ResultList_ColumnName_IsShowList.push(tempShow_data_Row_ResultList_ColName_Json);

            //You can destroy the table, all data and events related to an existing table by using the method destroy as shown below.
            jexcel.destroy(document.getElementById('divSheet_ResultList'), false);
            table_ResultList = jspreadsheet(document.getElementById('divSheet_ResultList'), {
                data: data_Row_ResultList_IsShowList,
                columns: data_Column_ResultList_IsShowList,

                style: style_ResultList,
                onbeforechange: event_BeforeChange_ResultList,
                onchange: event_Changed_ResultList,
                contextMenu: [],
            });
            //////###加载考勤结果的JExcel控件
        }

    <!--执行考勤分析-->
    <script type="text/javascript">
        function GetNowHtml() {
            return "<span class='label label-info'>" + new Date().format("yyyy-MM-dd hh:mm:ss") + "</span> &nbsp;&nbsp;&nbsp;&nbsp;";
        }
        ///执行考勤分析
        function DoAnalyseInit() {
            ShowWaittingAndTips();
            $("#myWaittingModalTitle").html("考勤分析中.....");
            $("#myWaittingModalContent").html(GetNowHtml() + "<span class='glyphicon glyphicon-info-sign text-success'></span>&nbsp;&nbsp;<span class='text-info'>正在初始化考勤分析...</span></br>");
            var yearMonth = $("#sel_YearMonth").val();
            var urlQuery = "M=" + Math.random() + "&param=analyse_doinit&userid=" + varPostSectionUserId + "&yearmonth=" + yearMonth;
            urlQuery = urlQuery + "&startday=" + varCurYearMonthDateFrom + "&endday=" + varCurYearMonthDateTo;
            //alert(urlQuery);
            urlQuery = escape(urlQuery);
            var url = "AnalyseHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                data: JSON.stringify(changedCellJsonData),
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");
                    var tempHtml = "";
                    //alert(dataJson.ReturnMsg);
                    if (dataJson.ReturnCode == '1') {
                        //console.log('data_Row_StaffList:', data_Row_StaffList);
                        //console.log('dataJson:', dataJson);

                        //add by sammen 20220303 如果新月份从未分析过，月度员工清单为空，所以在分析初始化时，同时先获取员工清单
                        var staffList = dataJson.ReturnStaffListData;
                        tempHtml = GetNowHtml() + "<span class='glyphicon glyphicon-ok text-success'></span>&nbsp;&nbsp;"
                            + "<span class='text-success'>初始化成功,准备依次对员工进行考勤分析...</span></br>";
                        $("#myWaittingModalContent").append(tempHtml);

                        setTimeout(function () {
                            //遍历员工进行分析
                            DoAnalyseByStaff(staffList, 0, dataJson.ReturnBatchNo);
                        }, 10)

                    } else {
                        tempHtml = GetNowHtml() + "<span class='glyphicon glyphicon-remove text-danger'></span>&nbsp;&nbsp;"
                            + "<span class='text-danger'>初始化失败,请重新刷新排班表后重试!</span></br>";
                        $("#myWaittingModalContent").append(tempHtml);
                        $('#btnCloseWaittingModal').show();
                    }
                }
            });
        }

        //考勤分析某个员工
        function DoAnalyseByStaff(allStaffItems, idxStaff, batchNo) {
            //console.log("DoAnalyseByStaff.idxStaff", idxStaff);
            if (idxStaff < allStaffItems.length) {
                var staffItem = allStaffItems[idxStaff];
                var staffNo = staffItem.DCNO;
                var staffName = staffItem.DCNAMECHS;
                var yearMonth = $("#sel_YearMonth").val();
                var urlQuery = "M=" + Math.random() + "&param=analyse_dobystaff&userid=" + varPostSectionUserId + "&yearmonth=" + yearMonth;
                urlQuery = urlQuery + "&startday=" + varCurYearMonthDateFrom + "&endday=" + varCurYearMonthDateTo + "&staffno=" + staffNo + "&batchno=" + batchNo;
                urlQuery = escape(urlQuery);
                var url = "AnalyseHandler.ashx?" + urlQuery;
                $.ajax({
                    cache: false,
                    url: url,
                    data: JSON.stringify(changedCellJsonData),
                    async: false,
                    error: function (request) {
                        HideWaitting();
                    },
                    success: function (data) {
                        //alert(data);
                        //console.log("DoAnalyseByStaff.data", data);
                        if (data == "") return false;
                        var dataJson = eval("(" + data + ")");
                        var tempHtml = "";
                        //alert(dataJson.ReturnMsg);
                        if (dataJson.ReturnCode == '1') {
                            tempHtml = GetNowHtml()
                                + "<span class='glyphicon glyphicon-ok text-success'></span>&nbsp;&nbsp;"
                                + (idxStaff + 1).toString() + "、"
                                + "<span class='text-success'>完成员工考勤分析：" + staffNo + staffName + "</span></br>";
                            $("#myWaittingModalContent").append(tempHtml);
                        } else {
                            tempHtml = GetNowHtml()
                                + "<span class='glyphicon glyphicon-remove text-danger'></span>&nbsp;&nbsp;"
                                + (idxStaff + 1).toString() + "、"
                                + "<span class='text-danger' > 员工考勤分析失败：" + staffNo + staffName + "</span></br > ";
                            $("#myWaittingModalContent").append(tempHtml);
                        }
                        setTimeout(function () {
                            //执行当前员工后继续执行下个员工的分析
                            DoAnalyseByStaff(allStaffItems, idxStaff + 1, batchNo);
                        }, 10)
                    }
                });
            } else {
                setTimeout(function () {
                    //单个分析结束后，进行分析汇总
                    DoAnalyseSummary(allStaffItems, batchNo);
                }, 10)
            }
        }

        //考勤分析汇总
        function DoAnalyseSummary(allStaffItems, batchNo) {
            var tempHtml = GetNowHtml() + "<span class='glyphicon glyphicon-info-sign text-success'></span>&nbsp;&nbsp;"
                + "<span class='text-info'>正在进行考勤分析汇总...</span></br>";
            $("#myWaittingModalContent").append(tempHtml);
            var yearMonth = $("#sel_YearMonth").val();
            var urlQuery = "M=" + Math.random() + "&param=analyse_dosummary&userid=" + varPostSectionUserId + "&yearmonth=" + yearMonth;
            urlQuery = urlQuery + "&startday=" + varCurYearMonthDateFrom + "&endday=" + varCurYearMonthDateTo + "&batchno=" + batchNo;
            urlQuery = escape(urlQuery);
            var url = "AnalyseHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                data: JSON.stringify(changedCellJsonData),
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    //console.log("DoAnalyseByStaff.data", data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");
                    //alert(dataJson.ReturnMsg);
                    var showMsg = "";
                    if (dataJson.ReturnCode == '1') {
                        showMsg = "<span class='glyphicon glyphicon-ok text-success'></span>&nbsp;&nbsp;"
                            + "<span class='text-success'>成功完成" + allStaffItems.length.toString() + "个员工的考勤分析!</span>";
                        tempHtml = GetNowHtml() + showMsg + "</br>";
                        $("#myWaittingModalContent").append(tempHtml);

                    } else {
                        showMsg = "<span class='glyphicon glyphicon-remove text-danger'></span>&nbsp;&nbsp;"
                            + "<span class='text-danger'>考勤分析汇总失败,请重新刷新排班表后重试!</span>";
                        tempHtml = GetNowHtml() + showMsg + "</br>";
                        $("#myWaittingModalContent").append(tempHtml);
                    }
                    $("#myWaittingModalTitle").html(showMsg);
                    $('#btnCloseWaittingModal').show();
                }
            });
        }



    </script>

    <script type="text/javascript">
        ///获取某月份某管辖用户下被锁定的人天【取KQRSSZ_2中的IsAttLocked=1的数据】
        function GetAttLockedStaffDays(isRefreshCell) {
            lockedStaffDateArrary = [];
            var urlQuery = "M=" + Math.random() + "&param=getattlockedstaffdays&userid=" + varPostSectionUserId + "&yearmonth=" + $("#sel_YearMonth").val();
            urlQuery = escape(urlQuery);
            var url = "AttLockedHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    //console.log('GetAttLockedStaffDays.data',data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");

                    //KQRSSZ_2中标记为锁定的员工工号#日期的数组
                    lockedStaffDateArrary = dataJson.ReturnRowData;
                    //console.log('lockedStaffDateArrary：', lockedStaffDateArrary);

                    //遍历数组，如果某人某天已被锁定，则设置对应cell为红色字体显示
                    if (isRefreshCell) {
                        $.each(lockedStaffDateArrary, function (n, value) {
                            //console.log('lockedStaffDateArrary.value', value);
                            var staffDateArray = value.split('#');
                            if (staffDateArray.length == 2) {
                                var varSSTAFFNO = staffDateArray[0];
                                var varDate = staffDateArray[1];
                                //根据某人某天的锁定标志设置界面中的表格显示
                                setLockShowByStaffOneDay(varSSTAFFNO, varDate, "1");
                            }

                        });
                    }
                }
            });
        }

        //从数据组中根据日期获取其在本周期内的顺序号
        function getDayOrderByDate(varDate) {
            var tempArray = data_Column_StaffList.filter(function (item,index) {
                return item.date && item.date == varDate
            })
            if (tempArray.length == 1) {
                return tempArray[0]["day"];
            } else {
                return -1
            }
            //console.log('tempArray:', tempArray);
        }

        //根据某人某天的锁定标志设置界面中的表格显示
        function setLockShowByStaffOneDay(varStaffNo, varDate, isToLock) {
            //console.log('GetLockedYearMonth.yearMonthLockedArrary',yearMonthLockedArrary);
            //console.log('GetDayLockedByYearMonth.dateLockedArrary', dateLockedArrary);
            //从数据组中根据日期获取其在本周期内的顺序号
            var varDay = getDayOrderByDate(varDate);
            //根据工号获取行号x
            var x = jsonData_DCNO_RowIndex.items(varStaffNo);
            //根据异常日期index获取列码
            var colChar = createCellPos(parseInt(varDay) - 1 + parseInt(fixedColumnCount_StaffList));
            //获取sheet中cell的位置
            var cellName = colChar + (x + 1).toString();
            //console.log('setLockShowByStaffOneDay.cellName', cellName);

            //如果这天不在已锁定日期列表中【已锁定的日期再前面已经整理设置了】
            var indexDateLocked = $.inArray(varDate, dateLockedArrary);
            if (indexDateLocked < 0 && varDay > -1) {
                if (isToLock=='1') {
                    //if (varSSTAFFNO == '0113' && varDay == '2022-10-30') {
                    //    console.log('varSSTAFFNO:', varSSTAFFNO);
                    //    console.log('varDay:', varDay);
                    //    console.log('cellName:', cellName);
                    //    console.log('data_Column_StaffList:', data_Column_StaffList);
                    //    console.log('table_StaffList:', table_StaffList);
                    //}
                    //console.log('setLockShowByStaffOneDay.设置为红色');
                    table_StaffList.setStyle(cellName, 'color', 'red');
                } else {
                    //console.log('setLockShowByStaffOneDay.设置为黑色');
                    table_StaffList.setStyle(cellName, 'color', 'black');
                }
            }
        }

        ///锁定/解锁某员工某一天排班锁定
        function LockStaffOneDay(staffNo,oneDay,isToLock) {
            var urlQuery = "M=" + Math.random() + "&param=lockstaffoneday&userid=" + varPostSectionUserId + "&staffno=" + staffNo + "&oneday=" + oneDay + "&istolock=" + isToLock;
            urlQuery = escape(urlQuery);
            var lockDesc = isToLock == '1' ? "锁定" : "解锁";
            lockDesc = lockDesc + "员工" + staffNo + "在" + oneDay + "的考勤排班";
            var url = "AttLockedHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    //console.log('LockStaffOneDay.data',data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");
                    //console.log('LockStaffOneDay.dataJson', dataJson);

                    //alert(dataJson.ReturnCode);
                    if (dataJson.ReturnCode == '1') {
                        Ealt.Etoast(lockDesc + '成功', 2)   //默认三秒
                        //重新刷新数据
                        GetAttLockedStaffDays(false);

                        setTimeout(function () {
                            //专门设置显示
                            setLockShowByStaffOneDay(staffNo, oneDay, isToLock);
                        }, 200)
                    } else {
                        Ealt.Etoast(lockDesc + '失败', 2)   //默认三秒
                    }
                }
            });
        }

        ///锁定/解锁某员工某一月排班锁定
        function LockStaffOneMonth(staffNo, yearMonth, isToLock) {
            var urlQuery = "M=" + Math.random() + "&param=lockstaffonemonth&userid=" + varPostSectionUserId + "&staffno=" + staffNo + "&yearmonth=" + yearMonth + "&istolock=" + isToLock;
            urlQuery = escape(urlQuery);
            var lockDesc = isToLock == '1' ? "锁定" : "解锁";
            lockDesc = lockDesc + "员工" + staffNo + "在期间" + yearMonth + "的考勤排班";
            var url = "AttLockedHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataJson = eval("(" + data + ")");

                    //alert(dataJson.ReturnCode);
                    if (dataJson.ReturnCode >= '1') {
                        Ealt.Etoast(lockDesc + '成功', 2)   //默认三秒
                        //重新刷新数据
                        GetAttLockedStaffDays(false);

                        setTimeout(function () {
                            console.log('data_Column_StaffList:', data_Column_StaffList);
                            //遍历整个月的进行专门设置显示
                            data_Column_StaffList.forEach(function (item, index) {
                                if (item.date) {
                                    setLockShowByStaffOneDay(staffNo, item.date, isToLock);
                                }
                            })
                        }, 200)
                    } else {
                        Ealt.Etoast(lockDesc + '失败', 2)   //默认三秒
                    }
                }
            });
        }
