
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>部门排版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <link href="../../common/css/main.css" rel="stylesheet" type="text/css" />
    <link href="../../common/css/button.css" type="text/css" rel="stylesheet" />
    <link href="../../common/css/topStyle.css" rel="stylesheet" type="text/css" />
    <link href="../../common/css/fixAreaStyle.css" type="text/css" rel="stylesheet" />

    <link rel='stylesheet' href='../../common/plugins/luckysheet/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='../../common/plugins/luckysheet/plugins/plugins.css' />
    <link rel='stylesheet' href='../../common/plugins/luckysheet/css/luckysheet.css' />
    <link rel='stylesheet' href='../../common/plugins/luckysheet/assets/iconfont/iconfont.css' />

</head>

<body>
    <script src="../../common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>

    <script src="../../common/plugins/luckysheet/plugins/js/plugin.js"></script>
    <script src="../../common/plugins/luckysheet/luckysheet.umd.js"></script>

    <div class="container-fluid">
        <div class="row-fluid">
            <div class="span12">
                <div id="luckysheet" style="margin:0px;padding:0px;position:absolute;width:100%;height:100%;left: 0px;top: 0px;"></div>

            </div>
        </div>
    </div>


    <script type="text/javascript">
        var screenWidth = screen.availWidth;
        var colWidth = (screenWidth - 110) / 31;
        var rowCount = 20;
        var optionData = [
            {
                "name": "Cell", //工作表名称
                "color": "", //工作表颜色
                "index": 0, //工作表索引
                "status": 1, //激活状态
                "order": 0, //工作表的下标
                "hide": 0,//是否隐藏
                "row": rowCount, //行数
                "column": 31, //列数
                "defaultRowHeight": 22, //自定义行高
                "defaultColWidth": colWidth, //自定义列宽
                "celldata": [], //初始化使用的单元格数据
                "config": {
                    "merge": {}, //合并单元格
                    "rowlen": {}, //表格行高
                    "columnlen": {}, //表格列宽
                    "rowhidden": {}, //隐藏行
                    "colhidden": {}, //隐藏列
                    "borderInfo": {}, //边框
                    "authority": {}, //工作表保护

                },
                "scrollLeft": 0, //左右滚动条位置
                "scrollTop": 315, //上下滚动条位置
                "luckysheet_select_save": [], //选中的区域
                "calcChain": [],//公式链
                "isPivotTable": false,//是否数据透视表
                "pivotTable": {},//数据透视表设置
                "filter_select": {},//筛选范围
                "filter": null,//筛选配置
                "luckysheet_alternateformat_save": [], //交替颜色
                "luckysheet_alternateformat_save_modelCustom": [], //自定义交替颜色	
                "luckysheet_conditionformat_save": {},//条件格式
                "frozen": {}, //冻结行列配置
                "chart": [], //图表配置
                "zoomRatio": 1, // 缩放比例
                "image": [], //图片
                "showGridLines": 1, //是否显示网格线
                "dataVerification": {} //数据验证配置
            }
        ]
        var optionCellRightClick = {
            copy: true, // 复制
            copyAs: false, // 复制为
            paste: true, // 粘贴
            insertRow: false, // 插入行
            insertColumn: false, // 插入列
            deleteRow: false, // 删除选中行
            deleteColumn: false, // 删除选中列
            deleteCell: false, // 删除单元格
            hideRow: false, // 隐藏选中行和显示选中行
            hideColumn: false, // 隐藏选中列和显示选中列
            rowHeight: false, // 行高
            columnWidth: false, // 列宽
            clear: true, // 清除内容
            matrix: false, // 矩阵操作选区
            sort: false, // 排序选区
            filter: false, // 筛选选区
            chart: false, // 图表生成
            image: false, // 插入图片
            link: false, // 插入链接
            data: false, // 数据验证
            cellFormat: false // 设置单元格格式
        }

        $(function () {
            //配置项
            var options = {
                container: 'luckysheet', //luckysheet为容器id
                title: '考勤排班', // 设定表格名称
                lang: 'zh', // 设定表格语言
                showtoolbar: false,//是否显示工具栏
                sheetFormulaBar: false,//是否显示公式栏
                showinfobar: false,//是否显示信息栏
                showsheetbar: false,//底部sheet页
                enableAddRow: false,//允许添加行
                enableAddBackTop: false,//允许回到顶部
                data: optionData,
                cellRightClickConfig: optionCellRightClick,
            }
            luckysheet.create(options)
        })

    </script>
    <!--页面初始化区域-->
    <script type="text/javascript">
    </script>

</body>
</html>
