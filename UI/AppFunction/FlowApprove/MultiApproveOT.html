    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModalTitle').html('正在处理中,请稍候.....');
            $('#myWaittingModalContent').html('');
            $('#myWaittingModal').modal();
            $('#btnCloseWaittingModal').hide();

            $('#myWaittingModal').modal('hide');
        }

    <script type="text/javascript">
        var varTID = GetUrlQueryString("P0");
        var varRID = GetUrlQueryString("P1");
        var varSID = GetUrlQueryString("P2");
        var varAID = GetUrlQueryString("P3");
        var varKeyValue = GetUrlQueryString("P4");
        var varUserId = GetUrlQueryString("P5");

        //日期控件注册
        var calendarOTApprove;

        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            $("#lb_PageSubTile").text('');

            $("#curUserId").text(varUserId);
            $("#curRoleDesc").text(varRID);
            $("#curSceneDesc").text(varSID);

            ///获取模版相应描述
            GetArchiveDesc();

            ///当前场景下的待办SQL语句
            GetNeedApproveSSLCT();

            //加载列表
            GetAndSetListResult(true);

            $('#btnCloseWaittingModal').click(function () {
                //所有选中的都执行完成了
                setTimeout(function () {
                    ///加载结果列表
                    GetAndSetListResult(true)
                }, 10)
            })
            ///同意操作
            $('#btnAgree').click(function () {
                BindButtonOperation("agree");
            });
            ///不同意拒绝操作
            $('#btnReject').click(function () {
                BindButtonOperation("reject");
            });
            ///关闭并刷新
            $('#btnClose').click(function () {
                if (window.opener != null) {
                    if (window.opener.document.getElementById('aRefresh') != null) {
                        window.opener.document.getElementById('aRefresh').click();
                    }
                }
                window.close();
            });

        });

    </script>

    <!--///获取模版相应描述-->
    <script type="text/javascript">
        ///获取模版相应描述
        function GetArchiveDesc() {
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&aid=" + varAID + "&keyvalue=" + varKeyValue + "&usercode=" + varUserId;
            var urlQuery = escape("M=" + Math.random() + "&param=getarchivedesc&" + strParam);
            var url = "MultiApproveOT.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaitting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    //console.log("dataobj", dataobj);
                    var ArchiveData = dataobj.ArchiveData;
                    var RoleData = dataobj.RoleData;
                    var SceneData = dataobj.SceneData;
                    if (ArchiveData.length == 1) {
                        var archiveDesc = ArchiveData[0]["TDESCCHS"].toString();
                        $("#curArchiveDesc").text(archiveDesc);
                    }
                    if (RoleData.length == 1) {
                        var roleDesc = RoleData[0]["RDESCCHS"].toString();
                        $("#curRoleDesc").text(roleDesc);
                    }
                    if (SceneData.length == 1) {
                        var sceneDesc = SceneData[0]["SDESCCHS"].toString();
                        $("#curSceneDesc").text(sceneDesc);
                    }

                    //console.log("RoleData", RoleData);

                }
            });
        }
    </script>

    <!--///初始化日期及部门清单-->
    <script type="text/javascript">
        ///获取加班审批日程表
        function InitOTCalendar() {
            $('#txt_SSLCT').val("");
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&sslct=" + $('#txt_SSLCT').text() + "&usercode=" + varUserId;
            var urlQuery = escape("M=" + Math.random() + "&param=getneedapprovedatelist&" + strParam);
            var url = "MultiApproveOT.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaitting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    //console.log("InitOTCalendar.dataobj", dataobj);
                    var dateList = dataobj.ResultData;
                    $('#spanCountDate').html(dateList.length.toString());
                    //console.log("dateList", dateList);
                    //注册日期控件mark选项要的格式
                    var markDate = ""
                    $.each(dateList, function (index, item) {
                        //console.log("item", item);
                        var temp = '"' + item['OTDATEF'] + '":""'
                        markDate = markDate + ((index == 0) ? "" : ",") + temp
                    })
                    markDate = "{" + markDate + "}"
                    //console.log("markDate", markDate);
                    markDate = eval("(" + markDate + ")");
                    //console.log("markDate", markDate);


                    //日期控件注册
                    calendarOTApprove = laydate.render({
                        elem: '#divDatepicker',
                        position: 'static',
                        show: true,
                        mark: markDate,
                        ready: function (date) {//change的动作会包含done的事件
                            //console.log('ready.date', date); //得到日期生成的值，如：2017-08-18
                            var tYear = date.year
                            var tMonth = (date.month < 10) ? "0" + date.month : date.month
                            var tDate = (date.date < 10) ? "0" + date.date : date.date
                            var dateString = tYear + "-" + tMonth + "-" + tDate;
                            //console.log('ready.value', dateString); //得到日期生成的值，如：2017-08-18
                            $("#txt_OTDate").val(dateString);
                        },
                        done: function (value, date, endDate) {
                            //console.log('done.value',value); //得到日期生成的值，如：2017-08-18
                            //console.log('done.date',date); //得到日期时间对象：{year: 2017, month: 8, date: 18, hours: 0, minutes: 0, seconds: 0}
                            //console.log('done.endDate', endDate); //得结束的日期时间对象，开启范围选择（range: true）才会返回。对象成员同上。
                            $("#txt_OTDate").val(value);
                            //获取需审批流程涉及到的部门清单
                            GetNeedApproveDeptList(value)
                        }
                    });
                }
            });
        }

        ///获取需审批流程涉及到的部门清单
        function GetNeedApproveDeptList(otDate) {
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&otdate=" + otDate + "&sslct=" + $('#txt_SSLCT').text() + "&usercode=" + varUserId;
            var urlQuery = escape("M=" + Math.random() + "&param=getneedapprovedeptlist&" + strParam);
            var url = "MultiApproveOT.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaitting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    console.log("dataobj", dataobj);
                    var DeptData = dataobj.ResultData;

                    $('#spanCountDept').html(DeptData.length.toString());

                    var tempHtml = "";
                    $('#divDeptList').html('');
                    $.each(DeptData, function (index, item) {
                        var varValue = item.OID;
                        var varName = item.ODESCCHS;
                        //var newTabContent = $("<button type=\"button\" class=\"btn btn-info btn-sm\" style=\"margin-left:10px\">" + varName + "</button>");
                        var newTabContent = $("<a href=\"#\" class=\"list-group-item aDeptList\" style=\"width:274px\" oid=\"" + varValue + "\" odesc=\"" + varName + "\">" + varValue + "-" + varName + "</a>");
                        $('#divDeptList').append(newTabContent);
                    });

                    //部门清单点击事件
                    $(".aDeptList").click(function () {
                        var oid = $(this).attr("oid");
                        var odesc = $(this).attr("odesc");
                        //alert(oid);

                        $(".aDeptList").each(function () {
                            $(this).removeClass("active");
                        })
                        $(this).addClass("active");
                    });
                }
            });
        }
    </script>

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult(isInvokeWaittingModal) {
            $("#lb_NoticeMsg").text('').hide();
            if (isInvokeWaittingModal) {
                ShowWaitting();
            }
            var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&aid=" + varAID + "&keyvalue=" + varKeyValue + "&usercode=" + varUserId;
            var urlQuery = escape("M=" + Math.random() + "&param=getpendingapprovelist&" + strParam);
            var url = "MultiApproveOT.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaitting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    //console.log("dataobj", dataobj);
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, column, columns = [], data = [];

                    //自定义第一列选择列
                    columns.push({
                        title: '选择',
                        field: 'check',
                        checkbox: true,
                        align: 'center',
                        valign: 'middle',
                        width: 10

                    });
                    //自定义第一列明细按钮列
                    columns.push({
                        title: '明细/Detail',
                        field: 'detail',
                        align: 'center',
                        valign: 'middle',
                        width: 10,
                        formatter: operateFormatter, //自定义方法，添加操作按钮
                        events: operateEvents

                    });
                    for (i = 0; i < dataobj.ColumnData.length; i++) {
                        column = dataobj.ColumnData[i];
                        columns.push({
                            field: column.ColumnValue,
                            title: column.ColumnName,
                            sortable: true,
                            visible: true,
                            halign: "left",
                            order: "desc"
                        });
                    }

                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    //console.log("columns", columns);
                    //console.log("data", data);
                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        columns: columns,
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                }
            });
            //反向赋值select控件
            $("#tbListTable select").each(function () {
                //alert($(this).attr("OldValue"));
                $(this).val($(this).attr("OldValue"));
            });
            //反向赋值Checkbox控件
            $("#tbListTable input[type='checkbox']").each(function () {
                if ($(this).attr("OldValue") == "true") {
                    $(this).attr("checked", "true");
                } else {
                    $(this).removeAttr("checked");
                }
            });

            if (isInvokeWaittingModal) {
                HideWaitting();
            }
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

        //定义每列的操作事件
        function operateFormatter(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var curFlowCode = RowData.FLOWCODE;
            return [
                '<a class="showDetail ml10" href="javascript:void(0)" title="明细" id ="a_' + curFlowCode + '">',
                '<i class="icon-remove"></i>明细/Detail',
                '</a>'
            ].join('');

        }
        window.operateEvents = {
            'click .showDetail': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var curFlowCode = RowData.FLOWCODE;
                //alert(curFlowCode);
                GetArchiveDetailUrl(curFlowCode);

            }
        };
    </script>

    <!--数据操作-->
    <script type="text/javascript">
        //根据FlowCode获取进行Detail模版页面的链接url
        function GetArchiveDetailUrl(flowCode) {
            var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&aid=" + varAID + "&keyvalue=" + flowCode + "&usercode=" + varUserId;
            var urlQuery = escape("M=" + Math.random() + "&param=getarchivedetailurl&" + strParam);
            var url = "MultiApproveOT.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                type: "post",
                data: $("#formList").serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                },
                success: function (data) {
                    //alert(data);
                    //console.log("flowCode", flowCode);

    <!--按钮操作-->
    <script type="text/javascript">
        function GetNowHtml() {
            return "<span class='label label-info'>" + new Date().format("yyyy-MM-dd hh:mm:ss") + "</span> &nbsp;&nbsp;&nbsp;&nbsp;";
        }
        ///按钮操作
        function BindButtonOperation(flag) {
            ShowWaitting();
            var flagDesc = flag == 'agree' ? $('#btnAgree').html() : $('#btnReject').html();

            var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            //console.log("getSelectRows:", getSelectRows);
            var iTotalSelectedCount = getSelectRows.length;
            //alert(iTotalSelectedCount);
            if (iTotalSelectedCount <= 0) {
                $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                HideWaitting();
            } else {
                if (confirm("已选择" + iTotalSelectedCount + "条记录，是否确认进行批量'" + flagDesc + "'操作？")) {
                    $("#lb_NoticeMsg").show().text('请稍候...');

                    $("#lb_NoticeMsg").show().text("批量'" + flagDesc + "'操作中....");
                    $("#myWaittingModalTitle").html("批量'" + flagDesc + "'操作中....");

                    //依次请求服务器进行同意或者拒绝操作,从第一个开始
                    DoAgreeOrRejectOneFlow(getSelectRows, flag, 0);

                } else {
                    $("#lb_NoticeMsg").show().hide();
                    HideWaitting();
                }
            }

        }

        //依次请求服务器进行同意或者拒绝操作
        function DoAgreeOrRejectOneFlow(getSelectRows, flag, idxFlow) {
            if (idxFlow < getSelectRows.length) {
                var RowData = getSelectRows[idxFlow];
                var flowCode = RowData.FLOWCODE;
                var strParam = "tid=" + varTID + "&rid=" + varRID + "&sid=" + varSID + "&aid=" + varAID + "&keyvalue=" + flowCode + "&opflag=" + flag + "&usercode=" + varUserId;
                var urlQuery = escape("M=" + Math.random() + "&param=doagreeorrejectoneflow&" + strParam);
                var url = "MultiApproveOT.ashx?" + urlQuery;
                $.ajax({
                    cache: false,
                    url: url,
                    async: false,
                    type: "post",
                    data: $("#formList").serialize(), // 你的formid
                    error: function (request) {
                        HideWaitting();
                        $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                    },
                    success: function (data) {
                        //alert(data);
                        //console.log("flowCode", flowCode);
                        //console.log("flag", flag);
                        //console.log("data", data);
                        var dataJson = eval("(" + data + ")");
                        //console.log("dataobj", dataJson);

                        var tempHtml = "";
                        //alert(dataJson.ReturnMsg);
                        if (dataJson.ReturnStatus.ReturnCode == '1') {
                            tempHtml = GetNowHtml()
                                + "<span class='glyphicon glyphicon-ok text-success'></span>&nbsp;&nbsp;"
                                + (idxFlow + 1).toString() + "、"
                                + "<span class='text-success'>[" + flowCode + "]:" + dataJson.ReturnStatus.ReturnMsg + "</span></br>";
                            $("#myWaittingModalContent").append(tempHtml);
                        } else {
                            tempHtml = GetNowHtml()
                                + "<span class='glyphicon glyphicon-remove text-danger'></span>&nbsp;&nbsp;"
                                + (idxFlow + 1).toString() + "、"
                                + "<span class='text-danger' > [" + flowCode + "]:" + dataJson.ReturnStatus.ReturnMsg + "</span></br > ";
                            $("#myWaittingModalContent").append(tempHtml);
                        }

                        setTimeout(function () {
                            //执行当前后继续执行下个流程
                            DoAgreeOrRejectOneFlow(getSelectRows, flag, idxFlow + 1);
                        }, 100)

                    }
                });
            } else {
                $('#myWaittingModalTitle').html('');
                $('#btnCloseWaittingModal').show();
            }

        }
    </script>


</body>
