    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult() {
            $("#lb_NoticeMsg").text('').hide();
            ShowWaitting();
            var strParam = "ismonthfix=" + $("#txtIsMonthFixCode").val();
            strParam = strParam + "&isstop=" + $("#txtIsStopCode").val();
            strParam = strParam + "&isreduce=" + $("#txtIsReduceCode").val();
            //alert(strParam);
            var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
            var url = "OtherPayItemList.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];

                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    HideWaiting();
                }
            });
            //反向赋值select控件
            $("#tbListTable select").each(function () {
                //alert($(this).attr("OldValue"));
                $(this).val($(this).attr("OldValue"));
            });
            //反向赋值Checkbox控件
            $("#tbListTable input[type='checkbox']").each(function () {
                if ($(this).attr("OldValue") == "true") {
                    $(this).attr("checked", "true");
                } else {
                    $(this).removeAttr("checked");
                }
            });

            HideWaiting();
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

    </script>

    <script type="text/javascript">
        //定义每行的项目英文名文本框
        function FormatterITEMNAME(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var varItemCode = RowData.ITEMCODE;
            var ITEMNAME = RowData.ITEMNAME;
            return [
                '<input type="text" id="txt#Item#' + varItemCode + '#ITEMNAME" OldValue = "' + ITEMNAME.toString() + '" class="form-control input-sm inputITEMNAME" value = "' + ITEMNAME + '"/>'
            ].join('');

        }

        //定义项目英文名的事件
        window.EventsITEMNAME = {
            'blur .inputITEMNAME': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var varItemCode = RowData.ITEMCODE;
                if ($(this).val() != $(this).attr("OldValue")) {
                    //即时保存单独每个字段控件的数据
                    SaveDataOneCtral(varItemCode, $(this).attr("id"), $(this).val());
                    $(this).attr("OldValue", $(this).val());
                }
            }
        };
    </script>

            var RowData = JSON.parse(JSON.stringify(row));
            var varItemCode = RowData.ITEMCODE;
            var SUMTO = RowData.SUMTO;
            var SUMTO_DESC = RowData.SUMTO_DESC;
            var txtClass = "btn-info";
            if (SUMTO == '020') {
                txtClass = "btn-warning";
            } if (SUMTO == '030') {
                txtClass = "btn-success";
            }
            return [
                '<span class="text">(' + SUMTO + ')</span>'
                + '<span class="text">' + SUMTO_DESC + '</span>'
                + '<span class="glyphicon glyphicon-collapse-down inputSUMTO pull-right"></span>'

                //校验为数值
                var pattern = /^([-]){0,1}([0-9]){1,}([.]){0,1}([0-9]){0,}$/;

                if (flag) {
                    $("#lb_NoticeMsg").text('').hide();
                    $(this).removeClass('btn-warning');

                        //即时保存单独每个字段控件的数据

                        $(this).attr("OldValue", $(this).val());
                    }
                } else {
                    $("#lb_NoticeMsg").show().text('颜色标记出的输入框请输入数值型');
                    $(this).addClass('btn-warning');
                    $(this).addClass('focus');
                    $(this).val("0");
                }
            }
        };
    </script>

    <!--加载所有项目列表到下拉框-->
    <script type="text/javascript">
        function GetAllNot030ListResult(otherPayItemCode, sumToItemCode) {
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "";
            strParam = strParam + "&isstop=2";
            //alert(strParam);
            var urlQuery = escape("M=" + Math.random() + "&param=querynot030list&" + strParam);
            var url = "PRItemIndex.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = JSON.parse(data);
                    var count = dataobj.ResultData.length;


                    //加载下拉列表sel_PRItem
                    $("#sel_PRItem").empty();
                    $("#sel_PRItem").append("<option value=''>" + "所有非公式类薪资项目（共" + count + "项）" + "</option>");
                    $.each(dataobj.ResultData, function (idx, item) {
                        var itemCode = unescape(item.ITEMCODE);
                        var typeName = unescape(item.ITEMECAL_DESC);
                        var showName = unescape(item.SHOWNAMECHS);
                        var displayDesc = '【' + typeName + '】' + itemCode + '-' + showName;
                        var isChecked = ""
                        if (sumToItemCode == itemCode) {
                            isChecked = "selected";
                        }

                        $("#sel_PRItem").append("<option value='" + itemCode + "' " + isChecked + ">" + displayDesc + "</option>");

                        ///反写
                        $("#sel_PRItem").val(sumToItemCode);
                    });

                    $("#sel_PRItem").selectpicker('refresh');
                    //构建表格####### End
                    HideWaiting();
                }
            });
            HideWaiting();
        }
    </script>

    <script type="text/javascript">
        //定义每行的操作
        function FormatterOperation(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));

            var ctrlId = "sel#Item#" + varItemCode + "#Operation";
            //alert(ctrlId);
            return [

                + ' </button>'
                + ' <ul class="dropdown-menu">'

                + ' </ul>'
            ].join('');
        }

        //定义操作的事件
        window.EventsOperation = {
            'click .inputOperation': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var varItemCode = RowData.ITEMCODE;
                var varItemName = RowData.ITEMNAMECHS;
                var ctrlId = $(this).attr("id");
                if (ctrlId == 'aViewDetail') {
                    OpenItemDetailPage(varItemCode);
                } else if (ctrlId == 'aDeleteItem') {
                    if (confirm("是否确定要删除项目【" + varItemCode + "-" + varItemName + "】")) {
                        DeleteOneItem(varItemCode);
                    }
                } else if (ctrlId == 'aExportDataSql') {
                    ExportDataSql(varItemCode);
                }

            }
        };
        //弹窗显示项目明细信息
        function OpenItemDetailPage(itemcode) {
            var urlQuery = escape("M=" + Math.random() + "&param=toedititempage&itemcode=" + itemcode);

            $.ajax({
                cache: false,
                url: url,

                type: "post",

                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                },
                success: function (data) {
                    //alert(data);
                    $("#txt_ResultData").val(data);
                    if (data == "") return false;

                    OpenNewWindow(data);
                }
            });
        }

    </script>
