    <!-- 模态框（Modal） -->
    <div class="modal fade" id="myWaittingModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog">

                    </button>-->

    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaiting() {
            $('#myWaittingModal').modal('hide');
        }
    </script>

    <script type="text/javascript">
        //var varItemCode = GetUrlQueryString("P0");
        var setting = {
            view: {
                addHoverDom: false,
                removeHoverDom: false,
                selectedMulti: false
            },
            check: {
                enable: false
            },
            data: {
                simpleData: {
                    enable: true
                }
            },
            edit: {
                enable: false
            }
        };
        var zNodes = [
            //{ id: 1, pId: 0, name: "[core] 基本功能 演示", open: true },
            //{ id: 101, pId: 1, name: "最简单的树 --  标准 JSON 数据" },
            //{ id: 2, pId: 0, name: "[excheck] 复/单选框功能 演示", open: true },
            //{ id: 201, pId: 2, name: "Checkbox 勾选操作" },
            //{ id: 3, pId: 0, name: "[exedit] 编辑功能 演示", open: true },
            //{ id: 301, pId: 3, name: "拖拽 节点 基本控制" },
            //{ id: 4, pId: 0, name: "大数据量 演示", open: true },
            //{ id: 403, pId: 4, name: "分批异步加载大数据量" }
        ];
        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            $('#formList').hide();
            $("#txtIsStopCode").val("2");
            $("#txtIsShowPrintCode").val("");
            $("#txtItemVerifyCode").val("020");
            $('#btnSwitchToListView').click(function (e) {
                ShowWaitting();
                setTimeout(function () {
                    window.location.href = 'PRItemIndex.html'
                }, 300)
            });
            //$.fn.zTree.init($("#treeDemo"), setting, zNodes);
            ///公式项目下拉框切换事件
            $('#sel_Type030').change(function () {
                ShowWaitting();
                if ($('#sel_Type030').val() != '') {
                    $('#formList').show();
                    GetOneItemInfo($('#sel_Type030').val(), '030');

                } else {
                    $('#formList').hide();
                }
                setTimeout(function () {
                    GetAndSetTreeByItemCode();
                }, 100)
            });
            $('#btn_ReturnSelected').click(function () {
                ShowWaitting();
                GetOneItemInfo($('#sel_Type030').val(), '030');
            });

            $('.aChangeIsStop').click(function (e) {
                $("#lbIsStopDesc").text($(this).html());
                $("#txtIsStopCode").val($(this).attr("refData"));

                $('.aChangeIsStop').removeClass("label-info");
                $(this).addClass("label-info");

                $('#formList').hide();
                ///加载所有公式列表
                GetAll030ListResult();
            });

            $('.aChangeIsShowPrint').click(function (e) {
                $("#lbIsShowPrintDesc").text($(this).html());
                $("#txtIsShowPrintCode").val($(this).attr("refData"));

                $('.aChangeIsShowPrint').removeClass("label-info");
                $(this).addClass("label-info");

                $('#formList').hide();
                ///加载所有公式列表
                GetAll030ListResult();
            });

            $('.aChangeItemVerify').click(function (e) {
                $("#lbItemVerifyDesc").text($(this).html());
                $("#txtItemVerifyCode").val($(this).attr("refData"));

                $('.aChangeItemVerify').removeClass("label-info");
                $(this).addClass("label-info");

                $('#formList').hide();
                ///加载所有公式列表
                GetAll030ListResult();
            });

            ///加载所有公式列表
            GetAll030ListResult();

            $('#btnSave').click(function (e) {
                SaveDataOneCtral();

                ///加载所有公式列表
                //GetAll030ListResult();
            });

        });


    </script>

    <!--加载所有公式项目列表到下拉框-->
    <script type="text/javascript">
        function GetAll030ListResult() {
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "";
            strParam = strParam + "&isstop=" + $("#txtIsStopCode").val();
            strParam = strParam + "&isshowprint=" + $("#txtIsShowPrintCode").val();
            strParam = strParam + "&verifycode=" + $("#txtItemVerifyCode").val();
            //alert(strParam);
            var urlQuery = escape("M=" + Math.random() + "&param=queryall030&" + strParam);
            var url = "PRItemTree.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = JSON.parse(data);
                    var count = dataobj.length;

                    //加载下拉列表sel_Type030
                    $("#sel_Type030").empty();
                    $("#sel_Type030").append("<option value=''>" + "所有公式类型的薪资项目（共" + count + "项）" + "</option>");
                    $.each(dataobj, function (idx, item) {
                        var showName = unescape(item.name);
                        var eppl = item.eppl;
                        var eppldesc = item.eppldesc;
                        var verifydesc = item.verifydesc;
                        $("#sel_Type030").append("<option value='" + item.id + "' verifydesc = '" + verifydesc + "' eppl = '" + eppl + "' eppldesc = '" + eppldesc + "'>" + showName + "</option>");
                    });

                    $("#sel_Type030").selectpicker('refresh');
                    //构建表格####### End
                    HideWaiting();
                }
            });
            HideWaiting();
        }
    </script>

    <!--实时加载某项目的明细信息-->
    <script type="text/javascript">
        function GetOneItemInfo(itemCode, itemType) {
            if (itemType == '030') {
                var strParam = "itemcode=" + itemCode;
                //alert(strParam);
                var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
                var url = "PRItemIndex.ashx?" + urlQuery;
                //alert(url);
                $.ajax({
                    cache: false,
                    type: "POST",
                    url: url,
                    async: false,
                    data: $('#formList').serialize(), // 你的formid
                    error: function (request) {
                        HideWaiting();
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                    },
                    success: function (data) {
                        //alert(data);
                        if ((data == "") || (data == "")) {
                            $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                            HideWaiting();
                            return false;
                        }
                        var jsonData = JSON.parse(data)
                        $('#txt_ItemEPPL').val(unescape(jsonData.ResultData[0].ITEMEPPL));
                        $('#txt_ItemEPPLDESC').val(unescape(jsonData.ResultData[0].EPPLDESC));
                        $('#lb_CurItemCode').text(unescape(jsonData.ResultData[0].ITEMCODE));
                        $('#txt_CurItemCode').val($('#lb_CurItemCode').text());
                        $('#lb_CurItemName').text(unescape(jsonData.ResultData[0].SHOWNAMECHS));
                        $('#lb_CurItemVerifyDesc').text(unescape(jsonData.ResultData[0].ITEMVERIFY_DESC));

                        //构建表格####### End
                        HideWaiting();
                    }
                });
                if (itemCode != $("#sel_Type030").val()) {
                    var curSelectedText = $('#sel_Type030').find("option:selected").text();
                    $('#btn_ReturnSelected').text('返回【' + curSelectedText + '】的公式');
                    $('#btn_ReturnSelected').show();
                } else {
                    $('#btn_ReturnSelected').hide();
                }
            }
            HideWaiting();
        }
    </script>

    <!--加载树形列表-->
    <script type="text/javascript">
        function GetAndSetTreeByItemCode() {
            $("#lb_NoticeMsg").text('').hide();
            var strParam = "parentcode=" + $("#sel_Type030").val();
            //alert(strParam);
            var urlQuery = escape("M=" + Math.random() + "&param=querytreelist&" + strParam);
            var url = "PRItemTree.ashx?" + urlQuery;
            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    //var dataobj = eval("(" + data + ")");
                    $("#txt_SelectedOrderNum").text(data);
                    var jsonData = JSON.parse(data)
                    $.fn.zTree.init($("#treeDemo"), setting, jsonData);

                    //构建表格####### End
                    HideWaiting();
                }
            });
            HideWaiting();
        }
    </script>

    <!--即时保存单独每个字段控件的数据-->
    <script type="text/javascript">
        ///即时保存单独每个字段控件的数据
        function SaveDataOneCtral() {
            $("#lb_NoticeMsg").show().text('保存中....');
            ShowWaitting();

            //请求服务器进行保存escape
            //Form提交模式
            var urlQuery = ("M=" + Math.random() + "&param=savedataonectrl");
            var url = "PRItemIndex.ashx?" + urlQuery;
            //alert(CtrlValue);
            $.ajax({
                cache: false,
                url: url,
                async: false,
                type: "post",
                data: $("#formList").serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;

                    var dataJson = JSON.parse(data);

                    if (dataJson.savedCount >= "1") {
                        HideWaiting();
                        $('#txt_ItemEPPL').val(unescape(dataJson.savedReturnData.ResultData[0].ITEMEPPL));
                        $('#txt_ItemEPPLDESC').val(unescape(dataJson.savedReturnData.ResultData[0].EPPLDESC));

                        var verifyCode = unescape(dataJson.savedReturnData.ResultData[0].ITEMVERIFY);
                        var verifyDesc = unescape(dataJson.savedReturnData.ResultData[0].ITEMVERIFY_DESC);
                        $('#lb_CurItemVerifyDesc').text(verifyDesc);
                        if (verifyCode == '030') {
                            $("#lb_NoticeMsg").show().text('本公式设置后验证无效,请重新设置');
                            setTimeout(function () {
                                $("#lb_NoticeMsg").text('').hide();
                            }, 5000);
                        } else {
                            $("#lb_NoticeMsg").show().text('修改成功!');
                            setTimeout(function () {
                                GetAndSetTreeByItemCode();
                                $("#lb_NoticeMsg").text('').hide();
                            }, 1000);
                        }

                    } else {
                        $("#lb_NoticeMsg").text(showString + '失败，请联系管理员处理!');
                        HideWaiting();
                    }
                }
            });
            HideWaiting();
        }
    </script>
