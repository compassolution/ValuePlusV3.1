    <script type="text/javascript">
        //判断是否登录
        function JudgeIsLogin() {
            var urlQuery = escape("M=" + Math.random());
            var url = "../CommonClientHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == '-9999') {
                        ShowWaitting();
                        $("#myWaittingModalContent").text('您尚未登录，请登录后重试！');
                    } else {
                        ///加载客户基本信息
                        LoadClientInfo();
                    }
                }
            })
        }
        ///加载客户基本信息
        function LoadClientInfo() {
            var urlQuery = escape("M=" + Math.random() + "&param=getclientinfo");
            var url = "../CommonClientHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    //alert(data);
                    console.log('LoadClientInfo.data', data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);
                    if (dataobj.ClientInfo == "") return false;

                    $.each(dataobj.ClientInfo, function (idx, item) {
                        $("#txt_ProjectId").html(unescape(item.ProjectId));
                        $("#txt_ClientName").html(unescape(item.ClientName));
                        $("#txt_RemoteServer").html(unescape(item.RemoteServer));
                    });

                    //$("#txt_ProjectId").html( 'VP_HR_YINNL'); 

                    ShowWaitting();
                    setTimeout(function () {
                        ///加载结果列表
                        GetAndSetListResult();

                    }, 100);
                }
            });
        }

    </script>
