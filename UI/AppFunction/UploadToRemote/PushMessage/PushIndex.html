    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaitting() {
            $('#myWaittingModal').modal('hide');
        }
        function showNewOpenWindow(url) {
            var randamNum = (Math.floor((Math.random() * 100) + 1)).toString();//100之内的随机数,可同时打开多个动作页面
            window.open(url, 'StaffMobileList' + randamNum, 'left=0,top=0,width=' + (screen.availWidth - 10) + ',height=' + (screen.availHeight - 50) + ',scrollbars,resizable=yes,toolbar=no,location=no');
        }
        function showOpenDialogPage(url) {
            var randamNum = (Math.floor((Math.random() * 100) + 1)).toString();//100之内的随机数,可同时打开多个动作页面
            window.showModalDialog(url, 'StaffMobileList' + randamNum, 'left:0;top:0;dialogWidth:' + (screen.availWidth - 10) + ';dialogHeight:' + (screen.availHeight - 50) + ';resizable:yes;toolbar:no;location:no');
        }
    </script>

            //});
            
            //判断是否登录
            JudgeIsLogin();

            $('#aViewMobileRegist').click(function () {
                showOpenDialogPage("../StaffMobile/StaffMobileList.html");
            });

            //$('#sel_MainStaff').on('changed.bs.select', function (e, clickedIndex, isSelected, previousValue) {

            //    $("#lbCount_Main").html("<已选中" + SelectedString.toString().split(",").length.toString()+"人>");
            //});
            /////用jquery自带的事件，因为changed.bs.select在取消了全部选择时无法触发

                } else {

            //$('#sel_CCStaff').on('changed.bs.select', function (e, clickedIndex, isSelected, previousValue) {
            //    var SelectedString = $('#sel_CCStaff').val();
            //    $("#lbCount_CC").html("<已选中" + SelectedString.toString().split(",").length.toString() + "人>");
            //});
            /////用jquery自带的事件，因为changed.bs.select在取消了全部选择时无法触发

                    $("#lbCount_CC").html("<已选中0人>");

    <!--加载页面信息-->
    <script type="text/javascript">
        //判断是否登录
        function JudgeIsLogin() {
            var urlQuery = escape("M=" + Math.random());
            var url = "../CommonClientHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                    $("#myWaittingModalContent").text('您尚未登录，请登录后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if (data == '-9999') {
                        ShowWaitting();
                        $("#myWaittingModalContent").text('您尚未登录，请登录后重试！');
                    } else {
                        ///加载客户基本信息
                        LoadClientInfo();
                    }
                }
            })
        }

        //判断该项目是否具有此功能的授权
        function JudgeProjectWXAuthIsValid(ProjectId, WXMPModule) {
            var IsValid = false;
            var urlQuery = escape("M=" + Math.random() + "&param=wxauthisvalid&projectid=" + ProjectId + "&wxmpmodule=" + WXMPModule);
            var url = $("#txt_RemoteServer").val() + "AppFunction/UploadToRemote/CommonServerHandler.ashx?" + urlQuery;
            if (isTestDebug) {
                url = "../CommonServerHandler.ashx?" + urlQuery;
            }
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                    $("#myWaittingModalContent").text('远程服务器请求异常，请重试！');
                },
                success: function (data) {
                    //alert(data);
                    if (data != 'true') {
                        alert(data);
                        ShowWaitting();
                        $("#myWaittingModalContent").text('您尚无此功能的操作授权或者授权已过期，请联系系统管理员咨询！');
                    } else {
                        IsValid = true;
                    }
                }
            });
            return IsValid;
        }


        ///加载客户基本信息
        function LoadClientInfo() {
            var urlQuery = escape("M=" + Math.random() + "&param=getclientinfo");
            var url = "ClientHandler.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                error: function (request) {
                    HideWaitting();
                    $("#myWaittingModalContent").text('加载页面信息失败，请稍后重试！');
                },
                success: function (data) {
                    //alert(data);

                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);
                    if (dataobj.ClientInfo == "") return false;

                    $.each(dataobj.ClientInfo, function (idx, item) {
                        $("#txt_ProjectId").val(unescape(item.ProjectId));
                        $("#txt_ClientName").val(unescape(item.ClientName));
                        $("#txt_RemoteServer").val(unescape(item.RemoteServer));
                        $("#txt_UserId").val(unescape(item.UserId));
                    });
                    
                    ///加载接收人下拉框
                    if (dataobj.StaffMobileListInfo != "") {
                        $("#sel_MainStaff").empty();
                        $("#sel_CCStaff").empty();
                        //$("#sel_MainStaff").append("<option value=''>" + "" + "</option>");
                        //$("#sel_CCStaff").append("<option value=''>" + "" + "</option>");

                        $.each(dataobj.StaffMobileListInfo, function (idx, item) {
                            var varMainStaff_String = "<option ";
                            var varMainStaff_String = varMainStaff_String + " value='" + unescape(item.档案库手机号码) + "+" + unescape(item.员工编号) + "+" + unescape(item.中文名) + "+" + unescape(item.所在部门) + "+" + unescape(item.职务) + "'";
                            //var varMainStaff_String = varMainStaff_String + " data-content='" + unescape(item.中文名) + "' ";
                            var varMainStaff_String = varMainStaff_String + "'";
                            var varMainStaff_String = varMainStaff_String + "<注册手机号>" + unescape(item.档案库手机号码);
                            var varMainStaff_String = varMainStaff_String + "---<工号>" + unescape(item.员工编号) + "---<姓名>" + unescape(item.中文名);
                            var varMainStaff_String = varMainStaff_String + "---<部门>" + unescape(item.所在部门) + "---<职务>" + unescape(item.职务) ;
                            var varMainStaff_String = varMainStaff_String + "</option>";
                            $("#sel_MainStaff").append(varMainStaff_String);
                            $("#sel_CCStaff").append(varMainStaff_String);

                            //$("#sel_MainStaff").append("<option value='" + unescape(item.档案库手机号码) + "'>" + unescape(item.员工编号) + unescape(item.中文名) + "(" + unescape(item.档案库手机号码) + ")" + "</option>");

                            //$("#sel_CCStaff").append("<option value='" + unescape(item.档案库手机号码) + "'>" + unescape(item.员工编号) + unescape(item.中文名) + "(" + unescape(item.档案库手机号码) + ")" + "</option>");

                        });
                    }
                    //获取推送消息类型数据
                    GetMessageType();
                }
            });
        }

        //获取推送消息类型数据
        function GetMessageType() {
            var urlQuery = escape("M=" + Math.random() + "&param=getmessagetypeinfo");
            var url = $("#txt_RemoteServer").val() + "AppFunction/UploadToRemote/CommonServerHandler.ashx?" + urlQuery;
            if (isTestDebug) {
                url = "../CommonServerHandler.ashx?" + urlQuery;
            }
            //alert(url);
            $.ajax({
                cache: false,
                url: url,
                async: false,
                data: $('#formPushIndex').serialize(), // 你的formid
                error: function (request) {
                    HideWaitting();
                    $("#myWaittingModalContent").text('远程服务器请求异常，请重试！');
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);

                    //加载消息类别下拉列表
                    if (dataobj.MessageTypeInfo != "") {
                        //加载下拉列表sel_MessageType
                        $("#sel_MessageType").empty();
                        $("#sel_MessageType").append("<option value=''>" + "请选择消息类别" + "</option>");
                        var iCount = 0;
                        var varFirstCID;
                        $.each(dataobj.MessageTypeInfo, function (idx, item) {
                            $("#sel_MessageType").append("<option value='" + item.CID + "'>" + unescape(item.CDESCCHS) + "</option>");
                            if (iCount == 0) { varFirstCID = item.CID; }
                            iCount++;
                        });
                        if (iCount == 1) {
                            $("#sel_MessageType").val(varFirstCID);
                        }
                    }
                }
            });
        }
    </script>

    <!--保存消息-->
    <script type="text/javascript">
    //保存消息
        function SaveMessageData()
        {
            var IsCanSave = true;
            if ($("#sel_MessageType").val() == null) {
                IsCanSave = false;
                $('#sel_MessageType').selectpicker('setStyle', 'btn-danger');
            }
            if ($("#sel_MainStaff").val() == null) {
                IsCanSave = false;
                $('#sel_MainStaff').selectpicker('setStyle', 'btn-danger');
            }
            //if ($("#sel_CCStaff").val() == null) {
            //    IsCanSave = false;
            //    $('#sel_CCStaff').selectpicker('setStyle', 'btn-danger');
            //}
            if ($("#txt_MessageTitle").val() == '') {
                IsCanSave = false;
                $("#txt_MessageTitle").css('background-color', 'red');
            }
            if ($('#txt_MessageContent').summernote('isEmpty')) {
                IsCanSave = false;
                //$("#txt_MessageContent").css('background-color', 'red');
                $('#txt_MessageContent').summernote('backColor', 'red');
            }
            //if ($("#txt_MessageContent").val() == '<p><br></p>') {
            //}
            //alert(IsCanSave);
            if (!IsCanSave) {
                ShowWaitting();
                $("#myWaittingModalContent").text('失败,请填写必填项目("类型"/"主接收人"/"标题"/"内容")后重试!');
                setTimeout(function () {
                    HideWaitting();
                }, 2000);
            } else {
                if (confirm("是否确定要推送?")) {
                    ShowWaitting();
                    $("#myWaittingModalContent").text('正在分析通知消息......');
                    var urlQuery = escape("M=" + Math.random() + "&param=savemessagedata&msgtype=" + $('#sel_MessageType').val() + "&projectid=" + $('#txt_ProjectId').val() + "&userid=" + $("#txt_UserId").val());
                    var url = $("#txt_RemoteServer").val() + "AppFunction/UploadToRemote/PushMessage/ServerHandler.ashx?" + urlQuery;
                    if (isTestDebug) {
                        url = "ServerHandler.ashx?" + urlQuery;
                    }
                    //alert(url);
                    $.ajax({
                        cache: false,
                        url: url,
                        type: "POST",//json数据大时，此配置非常重要
                        async: false,
                        dataType: 'json',
                        data: $('#formPushIndex').serialize(), // 你的formid
                        error: function (request) {
                            HideWaitting();
                            $("#myWaittingModalContent").text('远程服务器请求异常，请重试！');
                        },
                        success: function (data) {
                            //alert(data);
                            //alert(data.IsPushSuccess);
                            //alert(data.iNeedPushCount);
                            //alert(data.iHadPushCount);

                            var showResultString = "选择推送" + data.iNeedPushCount + "人，实际成功推送" + data.iHadPushCount + "人";
                            if (data.IsPushSuccess == '1') {
                                $("#myWaittingModalContent").html('推送通知消息成功！<br/>' + showResultString);

                                setTimeout(function () {
                                    HideWaitting();
                                }, 4000);
                            } else {
                                //ShowWaitting();
                                $("#myWaittingModalContent").html('推送通知消息失败，请联系系统管理员咨询！<br/>' + showResultString);
                                setTimeout(function () {
                                    HideWaitting();
                                }, 10000);
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
