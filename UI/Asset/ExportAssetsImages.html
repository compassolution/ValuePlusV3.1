
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>导出资产图片</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <link href="../common/css/main.css" rel="stylesheet" type="text/css" />
    <link href="../common/css/button.css" type="text/css" rel="stylesheet" />
    <link href="../common/css/topStyle.css" rel="stylesheet" type="text/css" />
    <link href="../common/css/fixAreaStyle.css" type="text/css" rel="stylesheet" />
    <link href="../common/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../common/bootstrap-table/bootstrap-table.css" rel="stylesheet" />
    <link href="../common/bootstrapSelect/bootstrap-select.css" rel="stylesheet" />
</head>

<body>
    <script src="../common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="../common/layer/layer.min.js" type="text/javascript"></script>
    <script src="../common/layer/layerLoading.js" type="text/javascript"></script>
    <script src="../common/bootstrap/bootstrap.js" type="text/javascript"></script>
    <script src="../common/bootstrap/bootstrap-tab.js" type="text/javascript"></script>

    <script src="../common/plugins/tableExport.jquery.plugin/tableExport.min.js"></script>
    <script src="../common/plugins/tableExport.jquery.plugin/libs/jsPDF/jspdf.min.js"></script>
    <script src="../common/plugins/tableExport.jquery.plugin/libs/jsPDF-AutoTable/jspdf.plugin.autotable.js"></script>
    <script src="../common/bootstrap-table/bootstrap-table.js" type="text/javascript"></script>
    <script src="../common/bootstrap-table/extensions/export/bootstrap-table-export.min.js"></script>
    <script src="../common/bootstrap-table/locale/bootstrap-table-zh-CN.js"></script>

    <script src="../common/bootstrapSelect/bootstrap-select.js" type="text/javascript"></script>
    <script src="../common/js/waitProcess.js" type="text/javascript"></script>
    <script src="../common/js/tableStyle.js" type="text/javascript"></script>
    <script src="../common/js/stringUtil.js" type="text/javascript"></script>
    <script src="../common/js/MainUtil.js" type="text/javascript"></script>

    <div class="container-fluid ">
        <div class="row-fluid">
            <div class="alert alert-success text-left" id="lb_Tips">
                <span>提示:1、本页面可以进行批量删除</span>
                <span>2、本页面中的可输入部分，在输入数据后会立即单独保存,请谨慎操作!</span>
            </div>
            <div class="col-sm-12">
                <form id="formList" class="form-horizontal" method="post">
                    <div class="row">
                        <div id="divCustomToolbar">
                            <div class="left-block">
                                <label id="lb_PageTile" class="" style="font-size:large">料单材料明细</label>
                                <label id="lb_PageSubTile" class="text-danger" style="font-size:large"></label>
                                <button id="btnExportPDF" type="button" class="btn btn-danger btn-sm">导出图片PDF</button>
                            </div>
                        </div>
                        <div id="divListTable" class="row-fluid">
                            <table id="tbListTable"
                                   data-toolbar="#divCustomToolbar"
                                   data-classes="table table-bordered table-striped table-hover"
                                   data-toggle="table"
                                   data-show-export="true"
                                   data-show-columns="true"
                                   data-show-toggle="true"
                                   data-pagination="true"
                                   data-height="700"
                                   data-cache="false"
                                   data-search="true"
                                   data-sortable="true"
                                   data-page-size="200"
                                   data-page-list="[20, 50,100, 200, 500, 1000]">
                                <thead>
                                    <tr>
                                        <th data-width="10%" data-field="SACODE" data-sortable="true" data-align="center" data-order="asc" >资产编号</th>
                                        <th data-width="15%" data-field="SANAMECHS" data-sortable="true" data-align="center" data-order="asc">资产名称</th>
                                        <th data-width="15%" data-field="SMODEL" data-sortable="true" data-align="center" data-order="asc">规格型号‎</th>
                                        <th data-width="15%" data-field="SUSEDEPTNAMECN" data-sortable="true" data-align="center" data-order="asc">使用部门‎</th>
                                        <th data-width="15%" data-field="LOCATIONNAMECN" data-sortable="true" data-align="center" data-order="asc">存放地址‎‎</th>
                                        <!--<th data-width="5%" data-field="AIMAGE" data-sortable="true" data-align="center" data-order="asc">图片文件名称‎‎</th>-->
                                        <th data-width="30%" data-field="ImageBase64String" data-formatter="ImageFormatter" data-align="center" data-events="operateEvents" >资产图片</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                    </div>
                    <div class="row">
                        <div class="text-center col-sm-12">
                            <div class="alert alert-danger text-center" id="lb_NoticeMsg" role="alert"></div>
                            <textarea type="text" id="txt_SelectedOrderNum" name="txt_SelectedOrderNum" class="form-control text-info" style="display:none"></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- 模态框（Modal） -->
    <div class="modal fade" id="myWaittingModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <!--<button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                        &times;
                    </button>-->
                    <h4 class="modal-title" id="myWaittingModalTitle">
                        正在处理中,请稍候.....
                    </h4>
                </div>
                <div id="myWaittingModalContent" class="modal-body">

                </div>
            </div>
        </div>
        <!-- /.modal -->
    </div>
    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaiting() {
            $('#myWaittingModal').modal('hide');
            $("#myWaittingModalTitle").text("正在处理中,请稍候.....");
        }
    </script>

    <script type="text/javascript">
        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();

            //加载列表
            GetAndSetListResult();

            $("#btnExportPDF").click(function () {
                $('#tbListTable').tableExport({
                    type: 'pdf',
                    htmlContent: true,
                    jspdf: {
                        orientation: 'l',
                        format: 'a4',
                        margins: { left: 10, right: 10, top: 20, bottom: 20 },
                        autotable: {
                            styles: {
                                cellPadding: 2,
                                rowHeight: 120,
                                fontSize: 8,
                                fillColor: 255,
                                textColor: 50,
                                fontStyle: 'normal',
                                overflow: 'ellipsize',
                                halign: 'inherit',
                                valign: 'middle'
                            },
                            tableExport: { outputImages: true },
                            tableWidth: 'auto'
                        }
                    }
                });
            })
        });

    </script>

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult() {
            $("#myWaittingModalTitle").append("<br>开始时间:" + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString());
            $("#lb_NoticeMsg").text('').hide();
            ShowWaitting();
            //var strParam = "keyvalue=" + keyvalue;
            //var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
            var urlQuery = escape("M=" + Math.random() + "&param=querylist");
            var url = "ExportAssetsImages.ashx?" + urlQuery;

            //alert(url);
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        data: data,
                        exportTypes: ['json', 'xml', 'csv', 'txt', 'sql', 'excel', 'pdf']
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    $("#myWaittingModalTitle").append("<br>结束时间:" + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString());
                    HideWaiting();
                }
            });
            HideWaiting();
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }


        function ImageFormatter(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var varBase64String = RowData.ImageBase64String;
            //var ImageName = RowData.AIMAGE;
            return [
                '<img id="imgPhoto" height = "120" width = "120" src="data:image/png;base64,' + varBase64String + '">'
                //'<img id="imgPhoto" height = "120" width = "120" src="../UserFile/MainImages/' + ImageName + '">'
            ].join('');

        }

    </script>

</body>
</html>
