        function ShowWaitting() {

            $('#myWaittingModal').modal('hide');

            window.open(url, 'inputOEStock', 'width=1000,height=800,top=100,left=100, center:1, toolbar=no, menubar=no, scrollbars=yes,resizable=yes,location=no, status=no');

    <script type="text/javascript">
        var IsBuildList = false;
        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            //var oTable = new InitBootstrapTable();
            //oTable.Init();

            ///加载盘点计划下拉框
            LoadStockPlanList();

            //下拉框加载
            if (!IsBuildList) {
                LoadDeptList();
                LoadLocationList();
                LoadCategoryList();
            }
            //选择切换盘点计划
            $('#sel_StockPlan').change(function () {
                $("#lb_NoticeMsg").text('').hide();
                if ($("#sel_StockPlan").val() != '') {
                    $("#divViewListReport").show();
                    var planUseDept = $("#sel_StockPlan").find("option:selected").attr('planUseDept');
                    var planOECategory = $("#sel_StockPlan").find("option:selected").attr('planOECategory');
                    //alert(planUseDept);
                    //alert(planOECategory);

                } else {
                    $("#divViewListReport").hide();
                }

                //计划中的指定部门
                $("#sel_Dept").val(planUseDept);
                $("#sel_Dept").find("option[value='" + planUseDept + "']").attr("selected", true);
                $("#sel_Dept").selectpicker('refresh');
                $("#sel_Dept").attr("readonly", true);

                //计划中的指定分类
                $("#sel_Category").val(planOECategory);
                $("#sel_Category").find("option[value='" + planOECategory + "']").attr("selected", true);
                $("#sel_Category").selectpicker('refresh');
                $("#sel_Category").attr("readonly", true);
            });

            ///查询事件
            $('#btnQuery').click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();

                    $("#lb_NoticeMsg").text('').hide();
                    setTimeout(function () {
                        GetAndSetListResult();
                        HideWaiting();
                    }, 500);
                }
                else {
                    $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                    $("#sel_StockPlan").focus();
                    HideWaiting();
                }
            });

            $("#btn_SetAll").click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();
                    setTimeout(function () {
                        BacthSetStockQty('set');
                        HideWaiting();
                    }, 2000);
                }
            })

            $("#btn_ClearAll").click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();
                    setTimeout(function () {
                        BacthSetStockQty('clear');
                        HideWaiting();
                    }, 2000);
                }

            })

            ///确定保存
            $('#btnSave').click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();
                    $("#lb_NoticeMsg").text('').hide();
                    setTimeout(function () {
                        SaveStockData();
                        HideWaiting();
                    }, 500);
                }
                else {
                    $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                    $("#sel_StockPlan").focus();
                    HideWaiting();
                }
            });

            $("#btnViewListReport").click(function () {
                var url = "../Query/SPQuery.aspx?SP=USP_OE_QRY_LocationStockDetail&AMPLAN=" + $("#sel_StockPlan").val();

                showOpenWindow(url);
            });

        });
    </script>

    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult() {
            ShowWaitting();
            var varStockPlan = $("#sel_StockPlan").val();
            var varDept = $("#sel_Dept").val();
            var varLocation = $("#sel_Location").val();
            var varCategory = $("#sel_Category").val();
            var varACode = $("#txt_ACode").val();
            var varAName = $("#txt_AName").val();
            var varAModel = $("#txt_AModel").val();
            var strParam = "stockplan=" + varStockPlan + "&dept=" + varDept + "&location=" + varLocation + "&category=" + varCategory + "&acode=" + varACode + "&aname=" + varAName + "&amodel=" + varAModel;
            var urlQuery = escape("M=" + Math.random() + "&param=queryAssetsList&" + strParam);
            var url = "InputOEStock.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj);
                    //alert(dataobj.ResultData.length); //输出ResultData的子对象数量//
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    if (rows > 0) {
                        $("#divOperationArea").show();
                    } else {
                        $("#divOperationArea").hide();
                    }

                    $('#tbAssetsList').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbAssetsList').bootstrapTable('resetView');
                    //构建表格####### End
                    HideWaiting();
                }
            });
            HideWaiting();
        }

        //定义每行的盘点数量文本框
        function FormatterStockQty(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var RowId = RowData.ID;
            var OECode = RowData.SACODE;
            var LocationCode = RowData.SLCODE;
            var OELocationCode = OECode + '*' + LocationCode;
            var stockQty = parseFloat(RowData.StockQty);
            return [
                '<input type="text" id="txt_Item_StockQty_' + RowId + '" class="form-control input-sm inputStockQty btn-primary" value = "' + stockQty + '"/>'
            ].join('');

        }

        //定义盘点数量的事件
        window.EventsStockQty = {
            'blur .inputStockQty': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var OECode = RowData.SACODE;
                var AllQty = RowData.NQUANTITY;
                var stockQty = RowData.StockQty;
                var InputStockQty = $(this).val();
                //校验为数值
                var pattern = /^[+-]?(\d+(\.\d*)?|\.\d+)$/;
                var flag = pattern.test(InputStockQty);
                if (flag) {
                    $("#lb_NoticeMsg").text('').hide();
                    $(this).removeClass('btn-warning');
                    var inputValue = parseFloat(InputStockQty);
                    var canSotck = parseFloat(AllQty);

                    if (inputValue > canSotck) {
                        if (confirm("输入的盘点数量大于帐存数量，是否确认?")) {
                        } else {
                            $(this).val(canSotck);
                        }
                    }
                } else {
                    $("#lb_NoticeMsg").show().text('颜色标记出的输入框请输入数值');
                    $(this).addClass('btn-warning');
                    $(this).addClass('focus');
                    $(this).val("0");
                }
            }
        };
    </script>
    
    <!--操作表每行数据-->
    <script type="text/javascript">
        function BacthSetStockQty(SetOrClear) {
            var allTableData = $('#tbAssetsList').bootstrapTable('getData');//获取表格的所有内容行

            for (i = 0; i < allTableData.length; i++) {
                //var RowData = JSON.parse(JSON.stringify(i));
                var id = allTableData[i].ID;
                var AllQty = allTableData[i].NQUANTITY;
                var stockQty = allTableData[i].StockQty;
                var $InputStockQty = $("#txt_Item_StockQty_" + id);
                if (SetOrClear == 'set') {
                    $InputStockQty.val(parseFloat(AllQty).toString());
                    //$InputStockQty.removeClass('btn-danger').addClass('btn-success');
                    $("#lb_NoticeMsg").show().text('已设置本页资产全部为盘点数量,点击保存按钮确定保存');
                } else if (SetOrClear == 'clear') {
                    $InputStockQty.val("0");
                    //$InputStockQty.removeClass('btn-success').addClass('btn-danger');
                    $("#lb_NoticeMsg").show().text('已清空所有盘点数量为0,点击保存按钮确定保存');
                }
            }
        }
    </script>

                $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                HideWaiting();
                return
            }
            //遍历行数据
            var varSelectedACODE = "";
            $("#txt_SelectSaveSACODE").val("");
            var allTableData = $('#tbAssetsList').bootstrapTable('getData',true);//获取表格的所有内容行
            //alert(allTableData.length);
            for (i = 0; i < allTableData.length; i++) {
                var id = allTableData[i].ID;
                var sACode = allTableData[i].SACODE;
                var sLCode = allTableData[i].SLCODE;
                var AllQty = allTableData[i].NQUANTITY;
                var stockQty;
                //alert(stockQty);

                try {
                    var $InputStockQty = $("#txt_Item_StockQty_" + id);
                    var stockQty = $InputStockQty.val();
                    var fStockQty = parseFloat(stockQty);
                } catch (err) {
                    alert(sACode);
                    continue;
                }

                var oneResult = sACode + '*' + sLCode + '*' + stockQty;
                if (i == 0) {
                    varSelectedACODE = oneResult;
                } else {
                    varSelectedACODE = varSelectedACODE + "," + oneResult;
                }
            }
            $("#txt_SelectSaveSACODE").val(varSelectedACODE);
            
            if (confirm("保存OE盘点数据（仅当前页数据），是否确认？")) {
                $("#lb_NoticeMsg").show().text('请稍候...');
                //请求服务器进行保存
                var varStockPlan = $("#sel_StockPlan").val();
                var strParam = "stockplan=" + varStockPlan;
                var urlQuery = escape("M=" + Math.random() + "&param=saveResult&" + strParam);
                var url = "InputOEStock.ashx?" + urlQuery;
                $.ajax({
                    cache: false,
                    url: url,
                    async: false,
                    type: "post",
                    data: $('#formList').serialize(), // 你的formid
                    error: function (request) {
                        HideWaiting();
                    },
                    success: function (data) {
                        $("#btnSave").attr("disabled", false);
                        //                            alert(data);
                        if (data == "") return false;

                        if (data == "1") {
                            $("#lb_NoticeMsg").show().text('保存当前页盘点结果成功！2秒钟后自动刷新列表.....');
                            setTimeout(function () {
                                HideWaiting();
                                $("#btnQuery").click();
                            },2000);
                        } else {
                            $("#lb_NoticeMsg").show().text('保存盘点结果失败，请稍后重试！');
                        }
                    }
                });
            }
            HideWaiting();
        }
    </script>
