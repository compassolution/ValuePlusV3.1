    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaiting() {
            $('#myWaittingModal').modal('hide');
        }
    </script>

    <script type="text/javascript">
        var IsBuildList = false;
        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            ///加载盘点计划下拉框
            LoadStockPlanList();

            //下拉框加载
            if (!IsBuildList) {
                LoadDeptList();
                LoadLocationList();
                LoadCategoryList();
                LoadLabelTypeList();
            }

            $('#sel_StockPlan').change(function () {
                $("#lb_NoticeMsg").text('').hide();
            });
            
            $('#sel_QueryType').change(function () {
                if ($('#sel_QueryType').val()=='true'){
                    $('#btnQuery').html('查询已盘到数据');
                    $("#btnSave").text("删除选中盘点数据");
                    $("#lb_PageSubTile").text("（已盘到资产列表）");
                    $("#btnSave").removeClass("btn-success").addClass("btn-danger");
                } else {
                    $('#btnQuery').html('查询未盘点资产');
                    $("#btnSave").text("保存资产盘点数据");
                    $("#lb_PageSubTile").text("（未盘点资产列表）");
                    $("#btnSave").removeClass("btn-danger").addClass("btn-success");
                }
            });

            ///查询事件
            $('#btnQuery').click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();
                    $("#lb_NoticeMsg").text('').hide();
                    setTimeout(function () {
                        GetAndSetListResult();
                        HideWaiting();
                    }, 500);
                }
                else {
                    $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                    $("#sel_StockPlan").focus();
                    HideWaiting();
                }
            });

            ///确定保存
            $('#btnSave').click(function () {
                if ($("#sel_StockPlan").val() != '') {
                    ShowWaitting();
                    $("#lb_NoticeMsg").text('').hide();
                    setTimeout(function () {
                        SaveStockData();
                        HideWaiting();
                    }, 500);
                }
                else {
                    $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                    $("#sel_StockPlan").focus();
                    HideWaiting();
                }
            });
        });
    </script>

    <!--加载下拉框列表结果-->
    <script type="text/javascript">
        ///加载盘点计划下拉框
        function LoadStockPlanList() {
            ShowWaitting();
            ///加载盘点计划下拉框
            var urlStockPlanQuery = escape("M=" + Math.random() + "&param=getStockPlan");
            var urlStockPlan = "AssetsCommon.ashx?" + urlStockPlanQuery;
            $.ajax({
                cache: false,
                url: urlStockPlan,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    //                                alert(data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);
                    if (dataobj.ResultData == "") return false;

                    //加载下拉列表sel_StockPlan
                    $("#sel_StockPlan").empty();
                    $("#sel_StockPlan").append("<option value=''>" + "请选择盘点计划" + "</option>");
                    $.each(dataobj.ResultData, function (idx, item) {
                        $("#sel_StockPlan").append("<option value='" + item.CID + "'>" + unescape(item.CDESCCHS) + "</option>");
                    });

                    HideWaiting();
                }
            });
        }

                    if (dataobj.ResultData == "") return false;

                    //加载下拉列表sel_Dept
                    $("#sel_Dept").empty();

                    $.each(dataobj.ResultData, function (idx, item) {
                        $("#sel_Dept").append("<option value='" + item.CID + "'>" + unescape(item.CDESCCHS) + "</option>");

                    HideWaiting();

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult() {
            ShowWaitting();
            var varStocked = $("#sel_QueryType").val();
            var strParam = "stocked=" + varStocked;
            var urlQuery = escape("M=" + Math.random() + "&param=queryAssetsList&" + strParam);
            var url = "InputStockResult.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    //alert(dataobj);
                    //alert(dataobj.ResultData.length); //输出ResultData的子对象数量//
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbAssetsList').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbAssetsList').bootstrapTable('resetView');
                    //构建表格####### End
                    HideWaiting();
                }
            });
            HideWaiting();
        }
    </script>
    
    <!--保存盘点结果-->
    <script type="text/javascript">
        function SaveStockData() {
            ShowWaitting();
            if ($("#sel_StockPlan").val() == '') {
                $("#lb_NoticeMsg").show().text('请选择其中一个盘点计划后重试！');
                HideWaiting();
                return
            }
            var getSelectRows = JSON.stringify($("#tbAssetsList").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            var iTotalCount = getSelectRows.length;
            //alert(iTotalCount);
            if (iTotalCount <= 0) {
                $("#lb_NoticeMsg").show().text('请选择任意资产后再重试！');
                HideWaiting();
            } else {
                var varStocked = $("#sel_QueryType").val();
                var showString = "并将保存为盘点数据";
                if (varStocked=='true') {
                    showString = "并将删除所选盘点数据";
                }
                if (confirm("已选择" + iTotalCount + "条记录，" + showString + ",是否确认？")) {
                    $("#lb_NoticeMsg").show().text('请稍候...');

                    var varSelectedACODE = "";
                    $("#txt_SelectSaveSACODE").val("");
                    for (var i = 0; i < iTotalCount; i++) {
                        var RowData = getSelectRows[i];
                        var sAcode = RowData.SACODE;
                        if (i == 0) {
                            varSelectedACODE = sAcode;
                        } else {
                            varSelectedACODE = varSelectedACODE + "," + sAcode;
                        }
                        $("#txt_SelectSaveSACODE").val(varSelectedACODE);
                    }

                    //请求服务器进行保存
                    var urlQuery = escape("M=" + Math.random() + "&param=saveResult&stocked=" + varStocked);
                    var url = "InputStockResult.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        url: url,
                        async: false,
                        type: "post",
                        data: $("#formList").serialize(), // 你的formid
                        error: function (request) {
                            HideWaiting();
                            $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                        },
                        success: function (data) {
                            //                            alert(data);
                            if (data == "") return false;

                            showString = "保存盘点数据";
                            if (varStocked == 'true') {
                                showString = "删除盘点数据";
                            }
                            if (data == "1") {
                                $("#lb_NoticeMsg").text(showString + '成功(资产数量:' + iTotalCount + ')!2秒钟后自动刷新列表.....');
                                setTimeout(function () {
                                    HideWaiting();
                                    $("#btnQuery").click();
                                }, 2000);
                            } else {
                                $("#lb_NoticeMsg").text(showString + '失败，请联系管理员处理!');
                            }
                        }
                    });
                    
                }
                HideWaiting();
            }

            HideWaiting();

        }
    </script>

</body>
