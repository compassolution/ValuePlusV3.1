
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>调整图片大小</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <link href="../common/css/main.css" rel="stylesheet" type="text/css" />
    <link href="../common/css/button.css" type="text/css" rel="stylesheet" />
    <link href="../common/css/topStyle.css" rel="stylesheet" type="text/css" />
    <link href="../common/css/fixAreaStyle.css" type="text/css" rel="stylesheet" />
    <link href="../common/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../common/bootstrapSelect/bootstrap-select.css" rel="stylesheet" />
</head>

<body>
    <script src="../common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="../common/layer/layer.min.js" type="text/javascript"></script>
    <script src="../common/layer/layerLoading.js" type="text/javascript"></script>
    <script src="../common/bootstrap/bootstrap.js" type="text/javascript"></script>
    <script src="../common/bootstrap/bootstrap-tab.js" type="text/javascript"></script>
    <script src="../common/js/waitProcess.js" type="text/javascript"></script>
    <script src="../common/js/tableStyle.js" type="text/javascript"></script>
    <script src="../common/js/stringUtil.js" type="text/javascript"></script>

    <div class="container-fluid ">
        <div class="row-fluid">
            <div class="col-sm-12">
                <form id="formList" class="form-horizontal" method="post">
                    <br />
                    <div class="row">

                        <div class="text-center col-sm-9">
                            <button id="aResize" type="button" class="btn btn-danger">调整图片</button>
                            <button id="aInsertData" type="button" class="btn btn-success">写入图片数据</button>
                        </div>
                        <img src="data:"/>
                    </div>
                </form>
            </div>
        </div>        <!-- 模态框（Modal） -->
        <div class="modal fade" id="myWaittingModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false" data-backdrop="static" data-keyboard="false" >
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <!--<button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                            &times;
                        </button>-->
                        <h4 class="modal-title" id="myWaittingModalTitle">
                            正在处理中,请稍候.....
                        </h4>
                    </div>
                    <div id="myWaittingModalContent" class="modal-body">
                        
                    </div>
                    <!--<div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">
                            关闭
                        </button>
                        <button type="button" class="btn btn-primary">
                            提交更改
                        </button>
                    </div>-->
                </div>
                <!-- /.modal-content -->
            </div>
            <!-- /.modal -->
        </div>

    </div>
    <script type="text/javascript">
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaiting() {
            $('#myWaittingModal').modal('hide');
            $("#myWaittingModalTitle").text("正在处理中,请稍候....." );
        }
    </script>

    <script type="text/javascript">
        $(document).ready(function () {
            $("#aInsertData").click(function () {
                ShowWaitting();
                $("#myWaittingModalTitle").append("<br>开始时间:" + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString());
                setTimeout(function () {
                    InsertImagesData();
                }, 500);

            })
            $("#aResize").click(function () {
                ShowWaitting();
                $("#myWaittingModalTitle").append("<br>开始时间:" + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString());
                setTimeout(function () {
                    ResizePrintImages();
                }, 500);

            })
        });

    </script>

    <script type="text/javascript">

        function InsertImagesData() {
            var urlImageResizeQuery = escape("M=" + Math.random() + "&param=insertdata");
            var urlImageResize = "ResizePrintImages.ashx?" + urlImageResizeQuery;
            var returnCount = 0;
            $.ajax({
                cache: false,
                url: urlImageResize,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    $("#myWaittingModalTitle").append("<br>结束时间:" + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString());
                    alert(data);
                    if (data == "") return false;
                    //var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);

                    setTimeout(function () {
                        HideWaiting();
                    }, 100);
                }
            });
        }
        function ResizePrintImages() {
            var urlImageResizeQuery = escape("M=" + Math.random() + "&param=resize");
            var urlImageResize = "ResizePrintImages.ashx?" + urlImageResizeQuery;

            $.ajax({
                cache: false,
                url: urlImageResize,
                async: false,
                error: function (request) {
                    HideWaiting();
                },
                success: function (data) {
                    $("#myWaittingModalTitle").append("<br>结束时间:" + new Date().toLocaleDateString()+" "+new Date().toLocaleTimeString());
                    alert(data);
                    if (data == "") return false;
                    //var dataobj = eval("(" + data + ")");
                    //alert(dataobj.root.length); //输出root的子对象数量
                    //                alert(dataobj.ResultData);

                    setTimeout(function () {
                        HideWaiting();
                    }, 100);
                }
            });
        }

    </script>

    <script type="text/javascript">

    </script>

</body>
</html>
