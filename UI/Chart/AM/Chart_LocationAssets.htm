
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title></title>
</head>
<script src="../../common/JS/echarts.min.js" type="text/javascript"></script>  
<body>

    <!-- 为 ECharts 准备一个具备大小（宽高）的Dom -->
    <div id="main" style="width: 1300px;height:600px;"></div>
    
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('main'));

        option = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {            // 坐标轴指示器，坐标轴触发有效
                    type: 'line'        // 默认为直线，可选为：'line' | 'shadow'
                }
            },
            legend: {
                data: ['机器设备类', '电子设备类', '办公用品类', '家具类', '其他类']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: [
                {
                    type: 'value'
                }
            ],
            yAxis: [
                {
                    type: 'category',
                    data: ['总经办', '财务部', '人力资源部', '房务部', '餐饮部', '员工餐厅', '保安部', '工程部', '水疗及健身']
                }
            ],
            series: [
            {
                name: '机器设备类',
                type: 'bar',
                stack: '总量',
                itemStyle: { normal: { label: { show: true, position: 'insideRight'}} },
                data: [320, 302, 301, 334, 390, 330, 320, 140, 220]
            },
            {
                name: '电子设备类',
                type: 'bar',
                stack: '总量',
                itemStyle: { normal: { label: { show: true, position: 'insideRight'}} },
                data: [120, 132, 101, 134, 90, 230, 210, 23, 98]
            },
            {
                name: '办公用品类',
                type: 'bar',
                stack: '总量',
                itemStyle: { normal: { label: { show: true, position: 'insideRight'}} },
                data: [220, 182, 191, 234, 290, 330, 310, 120, 76]
            },
            {
                name: '家具类',
                type: 'bar',
                stack: '总量',
                itemStyle: { normal: { label: { show: true, position: 'insideRight'}} },
                data: [150, 212, 201, 154, 190, 330, 410, 42, 220]
            },
            {
                name: '其他类',
                type: 'bar',
                stack: '总量',
                itemStyle: { normal: { label: { show: true, position: 'insideRight'}} },
                data: [820, 832, 901, 934, 590, 1330, 1320, 1022, 1100]
            }
        ]
        };

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
