
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <link href="../../common/css/main.css" rel="stylesheet" type="text/css" />
    <link href="../../common/css/button.css" type="text/css" rel="stylesheet" />
    <link href="../../common/css/topStyle.css" rel="stylesheet" type="text/css" />
    <link href="../../common/css/fixAreaStyle.css" type="text/css" rel="stylesheet" />
    <link href="../../common/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../../common/bootstrap-table/bootstrap-table.css" rel="stylesheet" />
    <link href="../../common/bootstrap-datetimepicker/css/bootstrap-datetimepicker.css" rel="stylesheet">
</head>
<body>
    <script src="../../common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="../../common/layer/layer.min.js" type="text/javascript"></script>
    <script src="../../common/layer/layerLoading.js" type="text/javascript"></script>
    <script src="../../common/bootstrap/bootstrap.js" type="text/javascript"></script>
    <script src="../../common/bootstrap/bootstrap-tab.js" type="text/javascript"></script>
    <script src="../../common/bootstrap-table/bootstrap-table.js" type="text/javascript"></script>
    <script src="../../common/bootstrap-datetimepicker/js/bootstrap-datetimepicker.js"></script>
    <script src="../../common/bootstrap-datetimepicker/js/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script src="../../common/js/waitProcess.js" type="text/javascript"></script>
    <script src="../../common/js/tableStyle.js" type="text/javascript"></script>
    <script src="../../common/JS/echarts.min.js" type="text/javascript"></script>
    
    <div class="row">
        <div class="col-sm-10 col-sm-offset-1">
            <div class="col-sm-2">
                <input id="txt_SearchDate" name="txt_SearchDate" class="form-control input-sm form_date" maxlength="30">
            </div>
            <div class="col-sm-2">
                <a id="btn_Search" class="btn btn-success btn-sm">确定</a>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-10 col-sm-offset-1">
            <!-- 为 ECharts 准备一个具备大小（宽高）的Dom -->
            <div id="ChartMain" style="width: 100%;height:600px;"></div>
            <!--<div id="ChartMain" ></div>-->
        </div>
    </div>

    <script type="text/javascript">
        //日期格式配置选项
        var dateFormatOptions = {
            language: 'zh-CN',
            weekStart: 7, //一周开始
            todayBtn: 1, //快速定位今天的按钮显示
            autoclose: true, //选择后是否自动关闭
            todayHighlight: 1, //今天日期是否高显
            startView: 2, //默认开始视图
            minView: 2, //时间视图(2为只选日期)
            forceParse: 1, //是否强制转换
            showMeridian: false,
            format: 'yyyy-mm-dd'
        };

        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('ChartMain'));

        var Array_Legend = ['在职人数', '今日在岗人数'];
        var Array_xAxis = [];
        var ArrayData_Series1 = [];
        var ArrayData_Series2 = [];

        $(document).ready(function () {
            //初始化日期格式字段
            $(".form_date").datetimepicker(dateFormatOptions).attr("readonly", true);
            $(".form_date").val(new Date().getFullYear() + '-' + padleft0(new Date().getMonth() + 1) + "-" + new Date().getDate());

            //获取图表数据
            GetChartData();

            //渲染图表
            SetCharts();

            $('#btn_Search').click(function () {
                //获取图表数据
                GetChartData();
                //渲染图表
                SetCharts();
            });

            //设置没隔1分钟刷新一次
            setInterval(function () {
                //alert(new Date().getMilliseconds());
                //获取图表数据
                GetChartData();
                //渲染图表
                SetCharts();
            },60000);
        });

        //获取图表数据
        function GetChartData() {
            Array_xAxis = [];
            ArrayData_Series1 = [];
            ArrayData_Series2 = [];
            var urlQuery = escape("M=" + Math.random() + "&param=getdata&date="+$('#txt_SearchDate').val());
            var url = "StaffOnDuty.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;
                    var dataobj = eval("(" + data + ")");

                    //横坐标数量
                    var rowCount_DeptName = dataobj.DeptName.length;
                    //表行数量
                    var rowCount_ResultData = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, tableRow_ResultData, tableData = [];

                    
                    for (var key in dataobj.DeptName) {
                        Array_xAxis.push(unescape(dataobj.DeptName[key]["CDESCCHS"]));
                    }
                    for (var key in dataobj.ResultData) {
                        ArrayData_Series1.push(unescape(dataobj.ResultData[key]["OnJobCount"]));
                        ArrayData_Series2.push(unescape(dataobj.ResultData[key]["OnDutyCount"]));
                    }

                }
            });

        }

        //补齐两位数  
        function padleft0(obj) {
            return obj.toString().replace(/^[0-9]{1}$/, "0" + obj);
        }
    </script>

    <script type="text/javascript">
        //渲染图表
        function SetCharts() {
            var chartOption = {
                title: {
                    show: true,
                    text: '人事图表测试',
                    textAlign: 'left'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {            // 坐标轴指示器，坐标轴触发有效
                        type: 'line'        // 默认为直线，可选为：'line' | 'shadow'
                    }
                },
                legend: {
                    data: Array_Legend
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        data: Array_xAxis,
                    }
                ],
                yAxis: [
                    {
                        type: 'value'
                    }
                ],
                series: [
                {
                    name: '在职人数',
                    type: 'bar',
                    label: {
                        normal: {
                            show: true,
                            position: 'top'
                        }
                    },
                    itemStyle: { normal: { label: { show: true, position: 'insideRight' } } },
                    data: ArrayData_Series1
                },
                {
                    name: '今日在岗人数',
                    type: 'bar',
                    label: {
                        normal: {
                            show: true,
                            position: 'top'
                        }
                    },
                    itemStyle: { normal: { label: { show: true, position: 'insideRight' } } },
                    data: ArrayData_Series2
                }
                ]
            };

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(chartOption,true);
        }
    </script>
</body>
</html>
