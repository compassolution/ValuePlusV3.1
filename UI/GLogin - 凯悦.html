
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ValuePlus Group Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto:400,100,300,500">
    <link href="common/bootstrap/bootstrap.css" rel="stylesheet">
    <link href="common/bootstrapSelect/bootstrap-select.css" rel="stylesheet" />
    <link href="common/Font-Awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="common/Group/GroupLogin.css" rel="stylesheet">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <!-- Favicon and touch icons -->
    <!--<link rel="shortcut icon" href="assets/ico/favicon.png">
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="assets/ico/apple-touch-icon-144-precomposed.png">
    <link rel="apple-touch-icon-precomposed" sizes="114x114" href="assets/ico/apple-touch-icon-114-precomposed.png">

    <link rel="apple-touch-icon-precomposed" href="assets/ico/apple-touch-icon-57-precomposed.png">-->

</head>
<body>
    <!-- Top content -->
    <div class="top-content">
        <div class="inner-bg">
            <div class="container">
                <div class="row">
                    <div class="col-sm-8 col-sm-offset-2 text">
                        <h1 style="font-family:STHupo"><strong>ValuePlus-HRMS</strong> Login</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-6 col-sm-offset-3 form-box">
                        <div class="form-top">
                            <div class="form-top-left">
                                <!--<h3>Login to system</h3>
                                <p>Enter your username and password to log on:</p>-->
                                <img src="common/Group/G_Logo.jpg" style="border-radius:5px;height:100px"/>
                            </div>
                            <div class="form-top-right">
                                <i class="fa fa-sign-in"></i>
                            </div>
                        </div>
                        <div class="form-bottom">
                            <form role="form" action="" method="post" class="login-form">
                                <!-- Single button -->
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group">
                                            <select id="sel_CompanyCode" name="sel_CompanyCode" class="selectpicker form-control default-font" data-live-search="true" data-style="btn-info" data-width="100%">
                                                <option value="">请选择酒店账套登录</option>
                                                <option value="1">上海外滩茂悦大酒店</option>
                                                <option value="2">三亚中心凯悦嘉轩酒店</option>
                                                <option value="3">北京东方君悦大酒店</option>
                                                <option value="4">广州富力君悦大酒店</option>
                                                <option value="5">杭州君悦酒店</option>
                                                <option value="6">......</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="sr-only" for="form-username">Username</label>
                                    <input type="text" id="txt_UserName" name="form-username" placeholder="Username..." class="form-username form-control text-center default-font">
                                </div>
                                <div class="form-group">
                                    <label class="sr-only" for="form-password">Password</label>
                                    <input type="password" id="txt_Password" name="form-password" placeholder="Password..." class="form-password form-control text-center default-font">
                                </div>
                                <button type="submit" id="btn_login" class="btn btn-danger btn-lg default-font">Sign in!</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 全局js -->
    <script src="common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="common/bootstrap/bootstrap.min.js"></script>
    <script src="common/bootstrapSelect/bootstrap-select.js" type="text/javascript"></script>
    <script src="common/Group/jquery.cookies.js" type="text/javascript"></script>
    <script src="common/Group/jquery.backstretch.min.js"></script>

    <script>
        function showNewOpenWindow(url) {
            var randamNum = (Math.floor((Math.random() * 100) + 1)).toString();//100之内的随机数,可同时打开多个动作页面
            window.open(url, 'FuncitonOpenPage' + randamNum, 'left=0,top=0,width=' + (screen.availWidth - 10) + ',height=' + (screen.availHeight - 50) + ',scrollbars,resizable=yes,toolbar=no,location=no');
        }

        jQuery(document).ready(function () {
            /*
                Fullscreen background
            */
            $.backstretch("common/Group/G_Backgroud.jpg");
            /*
                Form validation
            */
            $('.login-form input[type="text"], .login-form input[type="password"], .login-form textarea').on('focus', function () {
                $(this).removeClass('input-error');
            });
            $('.login-form').on('submit', function (e) {
                $(this).find('input[type="text"], input[type="password"], textarea').each(function () {
                    if ($(this).val() == "") {
                        e.preventDefault();
                        $(this).addClass('input-error');
                    }
                    else {
                        $(this).removeClass('input-error');
                    }
                });
            }); 
            $("#sel_CompanyCode").on('change', function (e) {
                $('.selectpicker').selectpicker('refresh');
                //if ($(this).val() == '') {
                //    $("#txt_UserName").removeAttr("disabled").attr("disabled", true);
                //    $("#txt_Password").removeAttr("disabled").attr("disabled", true);
                //    $("#btn_login").removeAttr("disabled").attr("disabled", true);
                //    $("#txt_UserName").val("");
                //    $("#txt_Password").val("");
                //} else {
                //    $("#txt_UserName").removeAttr("disabled");
                //    $("#txt_Password").removeAttr("disabled");
                //    $("#btn_login").removeAttr("disabled");
                //    $("#txt_UserName").val("admin");
                //    $("#txt_Password").val("admin");
                //}
            });

            $("#btn_login").on('click', function (e) {
                var url = "GIndex.html";
                var varUserId = $("#txt_UserName").val();
                var varPassword = $("#txt_Password").val();
                if ($("#sel_CompanyCode").val() == "1") {
                    var RedirectUrl = "https://www.compassolution.com/hrdemo/"
                } else if ($("#sel_CompanyCode").val() == "2") {
                    RedirectUrl = "https://www.compassolution.com/hrdemob/"
                } else if ($("#sel_CompanyCode").val() == "3") {
                    RedirectUrl = "https://www.compassolution.com/hrdemoc/"
                } else if ($("#sel_CompanyCode").val() == "4") {
                    RedirectUrl = "https://www.compassolution.com/hrdemoc/"
                } else if ($("#sel_CompanyCode").val() == "4") {
                    RedirectUrl = "https://www.compassolution.com/hrdemob/"
                } else {
                    RedirectUrl = "https://www.compassolution.com/hrdemo"
                }
                $.cookie('redirectUrl', RedirectUrl);
                $.cookie('userid', varUserId);
                $.cookie('pwd', varPassword);
                //window.location.href = url;
                //暂时定为弹出页面去打开各子物业酒店的地址
                showNewOpenWindow(RedirectUrl);
            });
        });
    </script>
</body>
</html>
