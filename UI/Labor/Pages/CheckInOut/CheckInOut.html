    <script type="text/javascript">
        function ShowWaitting() {
            $("#divCloseWaitting").hide();
            $("#myWaittingModalTitle").removeClass("text-success").removeClass("text-danger");
            $("#myWaittingModalTitle").html("正在处理中,请稍候.....");
            $('#myWaittingModal').modal();
        }
        function HideWaitting() {
            $('#myWaittingModal').modal('hide');
        }
        function ShowSuccessNotice(msg, subMsg) {
            ShowFailedNotice(msg, subMsg);
            $("#myWaittingModalTitle").removeClass("text-success").removeClass("text-danger").addClass("text-success");
            setTimeout(function () { HideWaitting ()}, 5000);
        }
        function ShowFailedNotice(msg, subMsg) {
            ShowWaitting();
            $("#myWaittingModalTitle").html(msg);
            if (!(subMsg == 'undefined' || subMsg == '')) {
                var subContent = "<div class=\"row text-info col-md-offset-3\"><h5>" + subMsg + "</h5></div>";
                $("#myWaittingModalContent").html(subContent);
            } else {
                $("#myWaittingModalContent").hide();
            }
            $("#divCloseWaitting").show();
            $("#myWaittingModalTitle").removeClass("text-success").removeClass("text-danger").addClass("text-danger");
        }
    </script>
    <script type="text/javascript">
        //签证是否登录
        GetLoginUserCode();
        function GetLoginUserCode() {
            var urlQuery = escape("M=" + Math.random() + "&param=getloginusercode");
            var url = "CheckInOut.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                data: $('#formIDCard').serialize(), // 你的formid
                async: false,
                error: function (request) {
                    HideWaitting();
                },
                success: function (data) {
                    //alert(data);
                    if (data == '') {
                        ShowFailedNotice("请登录系统后进行操作!","");
                        $("button").attr("disabled", true);
                    }else {
                        $('#lbCurUserCode').html(data);
                    }
                }
            });
        };
    </script>

        var curTimeInterval;
        var curTime;

        var clockInterval;
        var clockSecond = 0;
        var isReading = false;
        $(document).ready(function () {
            //ShowWaitting();
            //实时显示当前时间
            curTimeInterval = setInterval(function () {
                curTime = new Date().format("yyyy-MM-dd hh:mm:ss");
                $('#lbCurTime').html(curTime);
            }, 1000); //一秒执行一次

            //设置左侧div的高度
            var setHeigth = $('#divReadIDCardContent').height() + $('#divReadIDCardTips').height();
            //alert(setHeigth);
            $('#divRecordContent').height(setHeigth);

            $(window).unload(function () {
                clearInterval(curTimeInterval); //清除js定时器
                clearInterval(clockInterval); //清除js定时器
            });

            //判断当前系统指向不同的驱动
            var agent = navigator.userAgent.toLowerCase();
            if (agent.indexOf("win64") >= 0 || agent.indexOf("wow64") >= 0) {
                $("#hDriver32").hide();
                $("#hDriver64").show();
            } else {
                $("#hDriver32").show();
                $("#hDriver64").hide();
            }

            $('#myShowIDInfoModal').on('hidden', function () {
                $(this).removeData('modal');
            });


            //开始读取事件绑定
            $('#aReadFromRearder').click(function () {
                if (!isReading) {
                    startRead();
                } else {
                    stopRead();
                }
            });
            //开始读取
            function startRead() {
                clockSecond = 0;
                if (Connect()) {
                    isReading = true;
                    clockInterval = setInterval(function () {
                        clockSecond++;
                        $('#aReadFromRearder').text("阅读器准备就绪,请放上身份证件...." + (clockSecond.toString()));
                        $('#aReadFromRearder').removeClass("btn-primary").removeClass("btn-danger").addClass("btn-success");
                        GetIDInfo();
                    }, 1000); //一秒执行一次
                } else {
                    $('#aReadFromRearder').text("阅读器连接失败，请按照温馨提示指引操作后重试!");
                    $('#aReadFromRearder').removeClass("btn-primary").removeClass("btn-success").addClass("btn-danger");
                    //stopRead();
                }
            }

            //停止读取
            function stopRead() {
                isReading = false;
                clockSecond = 0;
                Disconnect();
                clearInterval(clockInterval); //清除js定时器
                $('#aReadFromRearder').text("点击开始读取");
                $('#aReadFromRearder').removeClass("btn-danger").removeClass("btn-success").addClass("btn-primary");
                resetFormContent();
            }

            //获取身份证信息并写入到页面
            function GetIDInfo() {
                var jsonData = GetJsonContent();
                //alert(jsonData);
                var dataobj = eval("(" + jsonData + ")");
                if (dataobj.info != null) {
                    var DataInfo = dataobj.info;
                    if (IsDemo) {
                        DataInfo = DemoObjectJson;
                    }

                    $("#txt_CardNo").val(dataobj.info.cardno);
                    $("#txt_CardNo_Show").val(DataInfo.cardno);

                    $("#imgPhoto").attr('src', 'data:image/png;base64,' + DataInfo.photo);
                    $("#txt_Name").val(DataInfo.name);
                    $("#txt_Sex").val(DataInfo.sex);
                    $("#txt_Nation").val(DataInfo.nation);
                    $("#txt_BirthDay").val(DataInfo.birth);
                    $("#txt_Address").val(DataInfo.address);
                    $("#txt_Org").val(DataInfo.org);
                    $("#txt_ValidDate").val(DataInfo.validata);
                    $("#txt_Photo").val(DataInfo.photo);

                    $("#btnCheckIn").attr("disabled", false);
                    $("#btnCheckOut").attr("disabled", false);
                    return true;
                } else {
                    //$('#aReadFromRearder').text("请重新放上身份证件....");
                    //$('#aReadFromRearder').removeClass("btn-primary").removeClass("btn-success").addClass("btn-danger");
                    return false;
                }
            }

            //清空表单中身份证读取内容
            function resetFormContent() {
                $("#imgPhoto").attr('src', '');
                $("#txt_CardNo").val("");
                $("#txt_CardNo_Show").val("");
                $("#txt_Name").val("");
                $("#txt_Sex").val("");
                $("#txt_Nation").val("");
                $("#txt_BirthDay").val("");
                $("#txt_Address").val("");
                $("#txt_Org").val("");
                $("#txt_ValidDate").val("");
                $("#txt_Photo").val("");
                $("#btnCheckIn").attr("disabled", true);
                $("#btnCheckOut").attr("disabled", true);
                clockSecond = 0;
            }
            //跳转查询更多记录
            $('#aToQuery').click(function () {
                var url = "QueryRecord.html";
                var obj = new Object();
                obj.name = "QueryRecord";
                var varWidth = screen.availWidth - 30;
                var varHeight = screen.availHeight - 30;
                var varParam = "dialogWidth=" + varWidth + "px;dialogHeight=" + varHeight + "px";
                window.showModalDialog(url, obj, varParam);
                //window.open(url, obj, varParam);
            });


            //签到按钮事件绑定
            $('#btnCheckIn').click(function () {
                if ($("#txt_CardNo").val() == '') {
                    this.attr("disabled", true);
                    ShowFailedNotice("未读取到正确的身份证件","");
                    //alert('未读取到正确的身份证件!');
                } else {
                    ShowWaitting();
                    $("#txt_CurTime").val(curTime);
                    var urlQuery = escape("M=" + Math.random() + "&param=checkinout&atttype=010");
                    var url = "CheckInOut.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        type: "POST",
                        url: url,
                        data: $('#formIDCard').serialize(), // 你的formid
                        async: false,
                        error: function (request) {
                            HideWaitting();
                        },
                        success: function (data) {
                            //alert(data);
                            var dataobj = eval("(" + data + ")");
                            var objReturnStatus = dataobj.ReturnStatus;
                            var objResultData = dataobj.ResultData;
                            if (objReturnStatus.ReturnCode != '1') {
                                ShowFailedNotice(objReturnStatus.ReturnMsg,"");
                            } else {
                                var varShowDesc_Main = $("#txt_Name").val() + "入场签到成功!";
                                var EmployDept_Name = dataobj.ResultData[0]["EmployDept_Name"].toString();
                                var EmployItem_Name = dataobj.ResultData[0]["EmployItem_Name"].toString();
                                var varShowDesc_Sub = "<font color = 'black'>用工部门名称：</font>" + EmployDept_Name + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>用工事项说明：</font>" + EmployItem_Name + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>工单起始时间：</font>" + dataobj.ResultData[0]["EmployTimeFrom"].toString() + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>工单结束时间：</font>" + dataobj.ResultData[0]["EmployTimeTo"].toString() + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>进场起始时间：</font>" + dataobj.ResultData[0]["EntryStartTime"].toString() + "<br/><br/>";
                                ShowSuccessNotice(varShowDesc_Main, varShowDesc_Sub);
                                AppendCheckRecordToDiv("010", curTime, EmployDept_Name, EmployItem_Name);
                                $("#myModal").modal('hide');
                            }
                        }
                    });

                    //清空表单中身份证读取内容
                    resetFormContent();
                }
            });
            //签出按钮事件绑定
            $('#btnCheckOut').click(function () {
                if ($("#txt_CardNo").val() == '') {
                    this.attr("disabled", true);
                    ShowFailedNotice("未读取到正确的身份证件","");
                } else {
                    ShowWaitting();
                    $("#txt_CurTime").val(curTime);
                    var urlQuery = escape("M=" + Math.random() + "&param=checkinout&atttype=020");
                    var url = "CheckInOut.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        type: "POST",
                        url: url,
                        data: $('#formIDCard').serialize(), // 你的formid
                        async: false,
                        error: function (request) {
                            HideWaitting();
                        },
                        success: function (data) {
                            //alert(data);
                            var dataobj = eval("(" + data + ")");
                            var objReturnStatus = dataobj.ReturnStatus;
                            var objResultData = dataobj.ResultData;
                            if (objReturnStatus.ReturnCode != '1') {
                                ShowFailedNotice(objReturnStatus.ReturnMsg,"");
                            } else {
                                var varShowDesc_Main = $("#txt_Name").val() + "离场签出成功!";
                                var EmployDept_Name = dataobj.ResultData[0]["EmployDept_Name"].toString();
                                var EmployItem_Name = dataobj.ResultData[0]["EmployItem_Name"].toString();
                                var varShowDesc_Sub = "<font color = 'black'>用工部门名称：</font>" + EmployDept_Name + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>用工事项说明：</font>" + EmployItem_Name + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>工单起始时间：</font>" + dataobj.ResultData[0]["EmployTimeFrom"].toString() + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>工单结束时间：</font>" + dataobj.ResultData[0]["EmployTimeTo"].toString() + "<br/><br/>";
                                varShowDesc_Sub = varShowDesc_Sub + "<font color = 'black'>进场起始时间：</font>" + dataobj.ResultData[0]["EntryStartTime"].toString() + "<br/><br/>";
                                ShowSuccessNotice(varShowDesc_Main, varShowDesc_Sub);
                                AppendCheckRecordToDiv("020", curTime, EmployDept_Name, EmployItem_Name);
                                $("#myModal").modal('hide');
                            }
                        }
                    });
                    //清空表单中身份证读取内容
                    resetFormContent();
                }
            });
        });

    </script>
    <!--页面初始化区域-->
    <script type="text/javascript">
        function AppendCheckRecordToDiv(checkType, checkTime, deptName, itemName) {
            var checkTypeName = checkType == "010" ? "入场签到" : "离场签出";
            var textStyle = checkType == "010" ? "text-success" : "text-danger";
            var cardNo = $("#txt_CardNo_Show").val();
            var name = $("#txt_Name").val();
            var sex = $("#txt_Sex").val();
            var showDesc = checkTime + " " + cardNo + "-" + name + "(" + sex + ")" + checkTypeName + "---部门：" + deptName + "---事项：" + itemName;

            var tempHtml = "<div class=\"row " + textStyle + "\" style=\"margin-left:20px\"><h5>" + showDesc + "</h5></div>";

            $("#divRecordBody").prepend(tempHtml);

        }

    </script>
