
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>外包工签到查询</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,Chrome=1" />
    <link href="../../../common/css/main.css" rel="stylesheet" type="text/css" />
    <link href="../../../common/css/button.css" type="text/css" rel="stylesheet" />
    <link href="../../../common/css/topStyle.css" rel="stylesheet" type="text/css" />
    <link href="../../../common/css/fixAreaStyle.css" type="text/css" rel="stylesheet" />
    <link href="../../../common/bootstrap/bootstrap.css" rel="stylesheet" />
    <link href="../../../common/bootstrap-table/bootstrap-table.css" rel="stylesheet" />
    <link href="../../../common/bootstrap-datetimepicker/css/bootstrap-datetimepicker.css" rel="stylesheet">
    <link href="../../../common/bootstrapSelect/bootstrap-select.css" rel="stylesheet" />
</head>

<body>
    <script src="../../../common/JQuery/jquery-1.10.2.js" type="text/javascript"></script>
    <script src="../../../common/layer/layer.min.js" type="text/javascript"></script>
    <script src="../../../common/layer/layerLoading.js" type="text/javascript"></script>
    <script src="../../../common/bootstrap/bootstrap.js" type="text/javascript"></script>
    <script src="../../../common/bootstrap/bootstrap-tab.js" type="text/javascript"></script>
    <script src="../../../common/bootstrap-table/bootstrap-table.js" type="text/javascript"></script>
    <script src="../../../common/bootstrap-datetimepicker/js/bootstrap-datetimepicker.js"></script>
    <script src="../../../common/bootstrap-datetimepicker/js/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script src="../../../common/bootstrapSelect/bootstrap-select.js" type="text/javascript"></script>
    <script src="../../../common/js/stringUtil.js" type="text/javascript"></script>
    <script src="../../../common/js/tableStyle.js" type="text/javascript"></script>


    <div class="container-fluid">
        <div class="row-fluid">
            <div class="span12">
                <div class="row-fluid">
                    <div id="divCustomToolbar">
                        <button id="aClose" type="button" class="btn" onclick="javascript: window.close();">关闭</button>
                        <button id="aFilter" type="button" class="btn btn-primary" style="display:">过滤查询</button>
                    </div>
                    <div id="divListTableNeedUpdate" class="row-fluid">
                        <table id="tbListIDCard"
                                data-toolbar="#divCustomToolbar"
                                data-classes="table table-bordered table-striped table-hover"
                                data-toggle="table"
                                data-show-columns="true"
                                data-show-toggle="false"
                                data-pagination="true"
                                data-height="750"
                                data-cache="false"
                                data-search="true"
                                data-sortable="true"
                                data-page-size="50"
                                data-page-list="[20, 50,100, 200, 500, 1000]">
                            <thead>
                                <tr>
                                    <th data-width="10%" data-field="LaborUser_IdentityNo" data-sortable="true" data-align="center" data-order="asc">身份证号码</th>
                                    <th data-width="6%" data-field="LaborUser_Name" data-sortable="true" data-align="center" data-order="asc">姓名</th>
                                    <th data-width="6%" data-field="LaborUser_GenderName" data-sortable="true" data-align="center" data-order="asc">性别</th>
                                    <th data-width="8%" data-field="AttType_Name" data-sortable="true" data-align="center" data-order="asc">类型</th>
                                    <th data-width="10%" data-field="ServiceCompany_Name" data-sortable="true" data-align="center" data-order="asc">来源公司</th>
                                    <th data-width="10%" data-field="AttTime" data-sortable="true" data-align="center" data-order="asc">时间</th>
                                    <th data-width="8%" data-field="EmployDept_Name" data-sortable="true" data-align="center" data-order="asc">用工部门</th>
                                    <th data-width="10%" data-field="EmployItem_Name" data-sortable="true" data-align="center" data-order="asc">用工事项</th>
                                    <th data-width="35%" data-field="AttDesc" data-sortable="true" data-align="center" data-order="asc">描述说明</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>

            </div>
        </div>
        <!-- 模态框（Modal） -->
        <div class="modal fade" id="myFilterModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="false" data-backdrop="static" data-keyboard="false">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">
                            条件过滤查询
                        </h4>
                    </div>

                    <div class="modal-body">
                        <form id="formIDCard" class="form-horizontal" method="post">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label class="col-md-4 control-label">身份证号码</label>
                                        <div class="col-md-8">
                                            <input type="text" id="txt_CardNo" name="txt_CardNo" class="form-control"/>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-4 control-label">姓名</label>
                                        <div class="col-md-8">
                                            <input type="text" id="txt_LaborName" name="txt_LaborName" class="form-control"/>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-4 control-label">日期</label>
                                        <div class="col-md-8">
                                            <input type="text" id="txt_AttDate" name="txt_AttDate" class="form-control form-date-input" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-4 control-label">类别</label>
                                        <div class="col-md-8">
                                            <select id="sel_AttType" name="sel_AttType" class="form-control input-sm">
                                                <option value="" selected>全部类型</option>
                                                <option value="010">入场签到</option>
                                                <option value="020">离场签出</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer row">
                        <div class="col-md-6">
                            <button id="btnCloseModal" type="button" data-dismiss="modal" class="btn pull-left"  aria-hidden="true">关闭</button>
                        </div>
                        <div class="col-md-6">
                            <button id="btnQuery" type="button" class="btn btn-success pull-right">点击查询</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /.modal -->
        </div>
    </div>

    <script type="text/javascript">
        //日期格式配置选项
        var dateFormatOptions = {
            language: 'zh-CN',
            weekStart: 7, //一周开始
            todayBtn: 1, //快速定位今天的按钮显示
            autoclose: true, //选择后是否自动关闭
            todayHighlight: 1, //今天日期是否高显
            startView: 2, //默认开始视图
            minView: 2, //时间视图(2为只选日期)
            forceParse: 1, //是否强制转换
            showMeridian: false,
            format: 'yyyy-mm-dd'
        };
        $(document).ready(function () {
            //初始化日期格式字段
            $(".form-date-input").datetimepicker(dateFormatOptions);
            //$(".form-date-input").attr("readonly", true);
            //$(".form-date-input").val(new Date().getFullYear() + '-' + padleft0(new Date().getMonth() + 1) + "-" + new Date().getDate());

            var curDate = new Date().format("yyyy-MM-dd");
            $("#txt_AttDate").val(curDate);

            $("#aFilter").click(function () {
                $('#myFilterModal').modal();
            });
            $('#btnQuery').click(function () {
                //加载列表
                GetLaborAttList();
            });
            //加载列表
            GetLaborAttList();
        });

    </script>
    <!--页面初始化区域-->
    <script type="text/javascript">
        //获取本地服务器中的已更新列表
        function GetLaborAttList() {
            var urlQuery = escape("M=" + Math.random() + "&param=queryrecord");
            var url = "CheckInOut.ashx?" + urlQuery;
            try {
                $.ajax({
                    cache: false,
                    url: url,
                    async: false,
                    type: "post",
                    data: $("#formIDCard").serialize(), // 你的formid
                    error: function (jqXHR, textStatus, errorThrown) {
                    },
                    success: function (result) {
                        //alert(result);
                        if (result == "") return false;
                        var dataobj = eval("(" + result + ")");
                        //                alert(dataobj);
                        //alert(dataobj.ResultData.length); //输出ResultData的子对象数量//
                        var item = dataobj.ResultData[0];
                        var rows = dataobj.ResultData.length;
                        //构建表格####### Start
                        var i, j, row, columns = [], data = [];

                        for (i = 0; i < rows; i++) {
                            row = {};
                            for (var key in dataobj.ResultData[i]) {
                                row[key] = unescape(dataobj.ResultData[i][key]);
                            }
                            data.push(row);
                        }

                        $('#tbListIDCard').bootstrapTable('destroy').bootstrapTable({
                            data: data
                        });

                        $('#tbListIDCard').bootstrapTable('review');

                    }
                });
                $('#myFilterModal').modal('hide');
            }
            catch (err) {
                $('#myFilterModal').modal('hide');
                return;
            }
        }
    </script>

</body>
</html>
