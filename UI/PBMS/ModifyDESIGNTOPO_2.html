    <!--//批量保存输入的数据-->
    <script type="text/javascript">
        function MuiltiModifyData() {
            var varInputPROVIDER = $("#txt_Modify_PROVIDER").val();
            var SaveCtrlId = "";
            var SaveCtrlValue = "";
            var i = 0;
            
            ShowWaitting();
            var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            var iTotalCount = getSelectRows.length;
            //alert(iTotalCount);
            if (iTotalCount <= 0) {
                $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                HideWaiting();
            } else {
                $("#lb_NoticeMsg").show().text('批量修改供应商中....');

                for (var i = 0; i < iTotalCount; i++) {
                    var RowData = getSelectRows[i];
                    var OrderNum = RowData.ORDERNUM;
                    var PROVIDER = RowData.PROVIDER;
                    var POCODE = RowData.POCODE;
                    var varThisCtrlId = 'txt_Item_' + OrderNum + '_PROVIDER';
                    if (POCODE == '') {
                        if (i == 0) {
                            SaveCtrlId = varThisCtrlId;
                            SaveCtrlValue = varInputPROVIDER.toString();
                        } else {
                            SaveCtrlId = SaveCtrlId + "*" + varThisCtrlId;
                            SaveCtrlValue = SaveCtrlValue + "*" + varInputPROVIDER.toString();
                        }
                        $("#" + varThisCtrlId).removeClass("ModifyProvider").addClass("ModifyProvider");
                    }
                }
                setTimeout(function () {
                    if (SaveCtrlId != '') {
                        SaveDataOneCtral(varKeyValue, SaveCtrlId, SaveCtrlValue);
                        setTimeout(function () {
                            $(".ModifyProvider").each(function () {
                                $(this).attr("OldValue", varInputPROVIDER);
                                $(this).val(varInputPROVIDER);
                            });
                            $('#myModifyModal').modal('hide');
                            $("#txt_Modify_PROVIDER").val("")
                            $("#lb_NoticeMsg").text('').hide();
                        }, 500);
                    }
                    HideWaiting();
                }, 500);
            }

        }
    </script>

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult(keyvalue) {
            $("#lb_NoticeMsg").text('').hide();
            ShowWaitting();

            //查看列表类别(是否是需要生成PO单的材料)
            var IsNeedBuildPo = $("#cb_IsNeedBuildPo").is(':checked');

            var strParam = "keyvalue=" + keyvalue + "&isneedbuildpo=" + IsNeedBuildPo;
            var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
            var url = "ModifyDESIGNTOPO_2.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    HideWaiting();
                }
            });
            //反向赋值select控件
            $("#tbListTable select").each(function () {
                //alert($(this).attr("OldValue"));
                $(this).val($(this).attr("OldValue"));
            });
            //反向赋值Checkbox控件
            $("#tbListTable input[type='checkbox']").each(function () {
                if ($(this).attr("OldValue") == "true") {
                    $(this).attr("checked", "true");
                }else {
                    $(this).removeAttr("checked");
                }
            });
            HideWaiting();
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

    </script>

    <!--//定义每行的生成PO数量文本框-->
    <script type="text/javascript">
        //定义每行的生成PO数量文本框
        function FormatterPOQTY(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var RowId = RowData.ORDERNUM;
            var POQTY = RowData.POQTY;
            var POCODE = RowData.POCODE; 
            var IsReadonly = POCODE == "" ? "" : "readonly";
            var txtClass = POCODE == "" ? " btn-info" : "";
            return [
                '<input type="text" id="txt_Item_' + RowId + '_POQTY" OldValue = "' + POQTY.toString() + '" ' + IsReadonly + '  class="form-control text-right input-sm inputPOQTY ' + txtClass + '" value = "' + POQTY + '"/>'
            ].join('');

        }

        //定义生成PO数量的事件
        window.EventsPOQTY = {
            'blur .inputPOQTY': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var RowId = RowData.ORDERNUM;
                var POQTY = RowData.POQTY;
                var AllQty = RowData.REMAINQTY;
                //alert(REMAINQTY);
                var InputPOQTY = $(this).val();
                //校验为数值
                var pattern = /^([-]){0,1}([0-9]){1,}([.]){0,1}([0-9]){0,}$/;
                var flag = pattern.test(InputPOQTY);
                if (flag) {
                    $("#lb_NoticeMsg").text('').hide();
                    $(this).removeClass('btn-warning');
                    var inputValue = parseFloat(InputPOQTY);
                    var canInputQty = parseFloat(AllQty);

                    if (inputValue != parseFloat($(this).attr("OldValue"))) {
                        if (inputValue > canInputQty) {
                            if (confirm("输入的生成PO数量不能大于可生成PO数量，是否确认?")) {
                            } else {
                                $(this).val(canInputQty);
                            }
                        }
                        //计算当前行的含税总价
                        ComputeTotalAmount(RowId);

                        //即时保存单独每个字段控件的数据(同时保存含税总价字段)(多个控件ID和值中间用*隔开)
                        var CtrlId_TATOLCOST = "txt_Item_" + RowId + "_TATOLCOST";
                        var SaveCtrlId = $(this).attr("id") + "*" + CtrlId_TATOLCOST;
                        var SaveCtrlValue = $(this).val().toString() + "*" + $("#" + CtrlId_TATOLCOST).val().toString();
                        SaveDataOneCtral(varKeyValue, SaveCtrlId, SaveCtrlValue);
                        $(this).attr("OldValue", $(this).val());

                    }
                } else {
                    $("#lb_NoticeMsg").show().text('颜色标记出的输入框请输入数值型');
                    $(this).addClass('btn-warning');
                    $(this).addClass('focus');
                    $(this).val("0");
                }
            }
        };
    </script>

            var url = "ModifyDESIGNTOPO_2.ashx?" + urlQuery;

                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');

    <script type="text/javascript">
        ///删除列表数据操作
        function DeleteDataList(keyvalue) {
            ShowWaitting();

            var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            var iTotalCount = getSelectRows.length;
            //alert(iTotalCount);
            if (iTotalCount <= 0) {
                $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                HideWaiting();
            } else {
                if (confirm("已选择" + iTotalCount + "条记录，是否确认删除？")) {
                    $("#lb_NoticeMsg").show().text('请稍候...');

                    var varSelectedOrderNum = "";
                    $("#txt_SelectedOrderNum").val("");
                    for (var i = 0; i < iTotalCount; i++) {
                        var RowData = getSelectRows[i];
                        var OrderNum = RowData.ORDERNUM;
                        var PROVIDER = RowData.PROVIDER; 
                        var POCODE = RowData.POCODE;
                        if (POCODE == '') {
                            if (i == 0) {
