    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult(keyvalue) {
            $("#lb_NoticeMsg").text('').hide();
            ShowWaitting();
            var strParam = "keyvalue=" + keyvalue;
            var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
            var url = "ModifyDesign_2.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    HideWaiting();
                }
            });
            //反向赋值select控件
            $("#tbListTable select").each(function () {
                //alert($(this).attr("OldValue"));
                $(this).val($(this).attr("OldValue"));
            });
            //反向赋值Checkbox控件
            $("#tbListTable input[type='checkbox']").each(function () {
                if ($(this).attr("OldValue") == "true") {
                    $(this).attr("checked", "true");
                }else {
                    $(this).removeAttr("checked");
                }
            });

            HideWaiting();
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

    </script>

    <!--//定义每行的下单数量文本框-->
    <script type="text/javascript">
        //定义每行的下单数量文本框
        function FormatterNTOTAL(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var RowId = RowData.ORDERNUM;
            var NTOTAL = RowData.NTOTAL;
            return [
                '<input type="text" id="txt_Item_' + RowId + '_NTOTAL" OldValue = "' + NTOTAL.toString() + '" class="form-control input-sm inputNTOTAL btn-info" value = "' + NTOTAL + '"/>'
            ].join('');

        }

        //定义下单数量数量的事件
        window.EventsNTOTAL = {
            'blur .inputNTOTAL': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var AllQty = RowData.ContractQty;
                var NTOTAL = RowData.NTOTAL;
                var InputNTOTAL = $(this).val();
                //校验为数值
                var pattern = /^([-]){0,1}([0-9]){1,}([.]){0,1}([0-9]){0,}$/;
                var flag = pattern.test(InputNTOTAL);
                if (flag) {
                    $("#lb_NoticeMsg").text('').hide();
                    $(this).removeClass('btn-warning');
                    var inputValue = parseFloat(InputNTOTAL);
                    var canInputQty = parseFloat(AllQty);

                    if (parseFloat($(this).val()) != parseFloat($(this).attr("OldValue"))) {
                        if (inputValue > canInputQty) {
                            if (confirm("输入的设计下量数量不能大于合同数量，是否确认?")) {
                            } else {
                                $(this).val(canInputQty);
                            }
                        }
                        //即时保存单独每个字段控件的数据
                        SaveDataOneCtral(varKeyValue, $(this).attr("id"), $(this).val());
                        $(this).attr("OldValue", $(this).val());
                    }
                } else {
                    $("#lb_NoticeMsg").show().text('颜色标记出的输入框请输入数值型');
                    $(this).addClass('btn-warning');
                    $(this).addClass('focus');
                    $(this).val("0");
                }
            }
        };
    </script>

    <!--删除列表数据操作-->
    <script type="text/javascript">
        ///删除列表数据操作
        function DeleteDataList(keyvalue) {
            ShowWaitting();
            $("#lb_NoticeMsg").show().text('批量删除中....');
            var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            var iTotalCount = getSelectRows.length;
            //alert(iTotalCount);
            if (iTotalCount <= 0) {
                $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                HideWaiting();
            } else {
                if (confirm("已选择" + iTotalCount + "条记录，是否确认删除？")) {
                    $("#lb_NoticeMsg").show().text('请稍候...');

                    var varSelectedOrderNum = "";
                    $("#txt_SelectedOrderNum").val("");
                    for (var i = 0; i < iTotalCount; i++) {
                        var RowData = getSelectRows[i];
                        var OrderNum = RowData.ORDERNUM;
                        if (i == 0) {
                            varSelectedOrderNum = OrderNum;
                        } else {
                            varSelectedOrderNum = varSelectedOrderNum + "," + OrderNum;
                        }
                        $("#txt_SelectedOrderNum").val(varSelectedOrderNum);
                    }

                    //请求服务器进行删除
                    var urlQuery = escape("M=" + Math.random() + "&param=deletelist&keyvalue=" + keyvalue);
                    var url = "ModifyDesign_2.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        url: url,
                        async: false,
                        type: "post",
                        data: $("#formList").serialize(), // 你的formid
                        error: function (request) {
                            HideWaiting();
                            $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                        },
                        success: function (data) {
                            //alert(data);
                            if (data == "") return false;

                            if (data >= "1") {
                                $("#lb_NoticeMsg").text('成功删除:' + iTotalCount + '条记录!2秒钟后自动刷新列表.....');
                                setTimeout(function () {
                                    HideWaiting();
                                    //加载列表
                                    GetAndSetListResult(varKeyValue);
                                }, 2000);
                            } else {
                                $("#lb_NoticeMsg").text(showString + '操作失败，请联系管理员处理!');
                            }
                        }
                    });

                } else {
                    $("#lb_NoticeMsg").show().hide();
                }
                HideWaiting();
            }

            HideWaiting();
        }
    </script>
