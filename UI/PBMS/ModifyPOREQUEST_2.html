    <script type="text/javascript">
        //日期格式配置选项
        var dateFormatOptions = {
            language: 'zh-CN',
            weekStart: 7, //一周开始
            todayBtn: 1, //快速定位今天的按钮显示
            autoclose: true, //选择后是否自动关闭
            todayHighlight: 1, //今天日期是否高显
            startView: 2, //默认开始视图
            minView: 2, //时间视图(2为只选日期)
            forceParse: 1, //是否强制转换
            showMeridian: false,
            format: 'yyyy-mm-dd'
        };
        function ShowWaitting() {
            $('#myWaittingModal').modal();
        }
        function HideWaiting() {
            $('#myWaittingModal').modal('hide');
        }
    </script>

    <script type="text/javascript">
        var varKeyValue = GetUrlQueryString("P0");

        $(document).ready(function () {
            $("#lb_NoticeMsg").text('').hide();
            $("#lb_PageSubTile").text('（采购申请单号:' + varKeyValue + '）');

            $('#btnMultiModify').click(function () {
                var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
                getSelectRows = JSON.parse(getSelectRows);
                var iTotalCount = getSelectRows.length;
                //alert(iTotalCount);
                if (iTotalCount <= 0) {
                    $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                } else {
                    $('#myModifyModal').modal();
                    $("#lb_NoticeMsg").text('').hide();
                }
            });
            $('#btnConfirmSave').click(function () {
                MuiltiModifyData();
            });

            //加载列表
            GetAndSetListResult(varKeyValue);
            
            ///删除操作
            $('#btnDelete').click(function () {
                DeleteDataList(varKeyValue);
            });

            //初始化日期格式字段
            $(".form-date-input").datetimepicker(dateFormatOptions);
            //$(".form-date-input").attr("readonly", true);
            $(".form-date-input").val(new Date().getFullYear() + '-' + padleft0(new Date().getMonth() + 1) + "-" + new Date().getDate());
        });

    </script>
    <!--//批量保存输入的数据-->
    <script type="text/javascript">
        function MuiltiModifyData() {
            var varInputExpectDate = $("#txt_Modify_ExpectDate").val();
            var SaveCtrlId = "";
            var SaveCtrlValue = "";
            var i = 0;
            $(".inputExpectDate").each(function () {
                if (i == 0) {
                    SaveCtrlId = $(this).attr("id");
                    SaveCtrlValue = varInputExpectDate.toString();
                } else {
                    SaveCtrlId = SaveCtrlId + "*" + $(this).attr("id");
                    SaveCtrlValue = SaveCtrlValue + "*" + varInputExpectDate.toString();
                }
                i++;
            });
            setTimeout(function () {
                if (SaveCtrlId != '') {
                    SaveDataOneCtral(varKeyValue, SaveCtrlId, SaveCtrlValue);
                    setTimeout(function () {
                        $(".inputExpectDate").each(function () {
                            $(this).attr("OldValue", varInputExpectDate);
                            $(this).val(varInputExpectDate);
                        });
                        $('#myModifyModal').modal('hide');
                        $("#txt_Modify_ExpectDate").val("")
                        $("#lb_NoticeMsg").text('').hide();
                    }, 500);
                }
            }, 500);
        }
    </script>

    <!--///加载结果列表-->
    <script type="text/javascript">
        ///加载结果列表
        function GetAndSetListResult(keyvalue) {
            $("#lb_NoticeMsg").text('').hide();
            ShowWaitting();
            var strParam = "keyvalue=" + keyvalue;
            var urlQuery = escape("M=" + Math.random() + "&param=querylist&" + strParam);
            var url = "ModifyPOREQUEST_2.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                type: "POST",
                url: url,
                async: false,
                data: $('#formList').serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                },
                success: function (data) {
                    //alert(data);
                    if ((data == "") || (data == "")) {
                        $("#lb_NoticeMsg").show().text('查询出现错误，请更正查询条件后重试！');
                        HideWaiting();
                        return false;
                    }
                    var dataobj = eval("(" + data + ")");
                    var item = dataobj.ResultData[0];
                    var rows = dataobj.ResultData.length;
                    //构建表格####### Start
                    var i, j, row, columns = [], data = [];


                    for (i = 0; i < rows; i++) {
                        row = {};
                        for (var key in dataobj.ResultData[i]) {
                            //对值进行编码处理特殊字符，如引号等//
                            row[key] = unescape(dataobj.ResultData[i][key]);
                        }
                        data.push(row);
                    }

                    $('#tbListTable').bootstrapTable('destroy').bootstrapTable({
                        data: data
                    });
                    $('#tbListTable').bootstrapTable('resetView');

                    ///设置表格自适应高度
                    SetBootstrapAutoHeight($('#tbListTable'));

                    //构建表格####### End
                    HideWaiting();
                }
            });
            //反向赋值select控件
            $("#tbListTable select").each(function () {
                //alert($(this).attr("OldValue"));
                $(this).val($(this).attr("OldValue"));
            });
            //反向赋值Checkbox控件
            $("#tbListTable input[type='checkbox']").each(function () {
                if ($(this).attr("OldValue") == "true") {
                    $(this).attr("checked", "true");
                }else {
                    $(this).removeAttr("checked");
                }
            });

            HideWaiting();
        }
        ///设置表格自适应高度
        function SetBootstrapAutoHeight($table) {
            var documentHeight = $(document).height();
            var varHeight = documentHeight - 140;
            $table.bootstrapTable('refreshOptions', {
                height: varHeight
            })
        }

    </script>

    <!--//定义每行的采购申请数量文本框-->
    <script type="text/javascript">
        //定义每行的采购申请数量文本框
        function FormatterRequestQty(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));
            var RowId = RowData.ORDERNUM;
            var RequestQty = RowData.RequestQty;
            return [
                '<input type="text" id="txt_Item_' + RowId + '_RequestQty" OldValue = "' + RequestQty.toString() + '" class="form-control text-right input-sm inputRequestQty btn-info" value = "' + RequestQty + '"/>'
            ].join('');

        }

        //定义采购申请数量的事件
        window.EventsRequestQty = {
            'blur .inputRequestQty': function (e, value, row, index) {
                var RowData = JSON.parse(JSON.stringify(row));
                var RowId = RowData.ORDERNUM;
                var AllQty = RowData.CanRequestQty;
                var RequestQty = RowData.RequestQty;
                var InputRequestQty = $(this).val();
                //校验为数值
                var pattern = /^([-]){0,1}([0-9]){1,}([.]){0,1}([0-9]){0,}$/;
                var flag = pattern.test(InputRequestQty);
                if (flag) {
                    $("#lb_NoticeMsg").text('').hide();
                    $(this).removeClass('btn-warning');
                    var inputValue = parseFloat(InputRequestQty);
                    var canInputQty = parseFloat(AllQty);

                    if (inputValue > canInputQty) {
                        if (confirm("输入的申请采购数量不能大于可申请数量，是否确认?")) {
                        } else {
                            $(this).val(canInputQty);
                        }
                    }
                    if (parseFloat($(this).val()) != parseFloat($(this).attr("OldValue"))) {
                        //即时保存单独每个字段控件的数据(同时保存含税总价字段)(多个控件ID和值中间用*隔开)
                        var SaveCtrlId = $(this).attr("id");
                        var SaveCtrlValue = $(this).val();
                        SaveDataOneCtral(varKeyValue, SaveCtrlId, SaveCtrlValue);
                        $(this).attr("OldValue", $(this).val());
                    }
                } else {
                    $("#lb_NoticeMsg").show().text('颜色标记出的输入框请输入数值型');
                    $(this).addClass('btn-warning');
                    $(this).addClass('focus');
                    $(this).val("0");
                }
            }
        };
    </script>
    
    <!--//定义每行的期望到货日期文本框-->
    <script type="text/javascript">
        //定义每行的期望到货日期文本框
        function FormatterExpectDate(value, row, index) {
            var RowData = JSON.parse(JSON.stringify(row));

            var ExpectDate = RowData.ExpectDate;
            return [
                '<input type="text" id="txt_Item_' + RowId + '_ExpectDate" OldValue = "' + ExpectDate.toString() + '" class="form-control text-center input-sm inputExpectDate form-date-input btn-info" value = "' + ExpectDate + '"/>'
            ].join('');

                var RowData = JSON.parse(JSON.stringify(row));

                var InputExpectDate = $(this).val();
                if ($(this).val() != $(this).attr("OldValue")) {

    <!--//定义每行的备注文本框-->
    <script type="text/javascript">
        //定义每行的备注文本框

            var RowData = JSON.parse(JSON.stringify(row));

				if ($(this).val() != $(this).attr("OldValue")) {

    <!--即时保存单独每个字段控件的数据-->
    <script type="text/javascript">
        ///即时保存单独每个字段控件的数据
        function SaveDataOneCtral(keyvalue, CtrlId, CtrlValue) {
            $("#lb_NoticeMsg").show().text('保存中....');
            ShowWaitting();

            //请求服务器进行保存
            var urlQuery = escape("M=" + Math.random() + "&param=savedataonectrl&keyvalue=" + keyvalue + "&ctrlid=" + CtrlId + "&ctrlvalue=" + CtrlValue);
            var url = "ModifyPOREQUEST_2.ashx?" + urlQuery;
            $.ajax({
                cache: false,
                url: url,
                async: false,
                type: "post",
                data: $("#formList").serialize(), // 你的formid
                error: function (request) {
                    HideWaiting();
                    $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                },
                success: function (data) {
                    //alert(data);
                    if (data == "") return false;

                    if (data >= "1") {
                        $("#lb_NoticeMsg").text('修改成功!');
                        setTimeout(function () {
                            HideWaiting();
                            $("#lb_NoticeMsg").text('').hide();
                        }, 500);
                    } else {
                        $("#lb_NoticeMsg").text(showString + '失败，请联系管理员处理!');
                        HideWaiting();
                    }
                }
            });
            HideWaiting();
        }
    </script>

    <!--删除列表数据操作-->
    <script type="text/javascript">
        ///删除列表数据操作
        function DeleteDataList(keyvalue) {
            ShowWaitting();
            $("#lb_NoticeMsg").show().text('批量删除中....');
            var getSelectRows = JSON.stringify($("#tbListTable").bootstrapTable('getSelections'));
            getSelectRows = JSON.parse(getSelectRows);
            var iTotalCount = getSelectRows.length;
            //alert(iTotalCount);
            if (iTotalCount <= 0) {
                $("#lb_NoticeMsg").show().text('请至少选择一条记录后重试！');
                HideWaiting();
            } else {
                if (confirm("已选择" + iTotalCount + "条记录，是否确认删除？")) {
                    $("#lb_NoticeMsg").show().text('请稍候...');

                    var varSelectedOrderNum = "";
                    $("#txt_SelectedOrderNum").val("");
                    for (var i = 0; i < iTotalCount; i++) {
                        var RowData = getSelectRows[i];
                        var OrderNum = RowData.ORDERNUM;
                        if (i == 0) {
                            varSelectedOrderNum = OrderNum;
                        } else {
                            varSelectedOrderNum = varSelectedOrderNum + "," + OrderNum;
                        }
                        $("#txt_SelectedOrderNum").val(varSelectedOrderNum);
                    }

                    //请求服务器进行删除
                    var urlQuery = escape("M=" + Math.random() + "&param=deletelist&keyvalue=" + keyvalue);
                    var url = "ModifyPOREQUEST_2.ashx?" + urlQuery;
                    $.ajax({
                        cache: false,
                        url: url,
                        async: false,
                        type: "post",
                        data: $("#formList").serialize(), // 你的formid
                        error: function (request) {
                            HideWaiting();
                            $("#lb_NoticeMsg").show().text('请求服务器时出错，请联系管理员处理!');
                        },
                        success: function (data) {
                            //alert(data);
                            if (data == "") return false;

                            if (data >= "1") {
                                $("#lb_NoticeMsg").text('成功删除:' + iTotalCount + '条记录!2秒钟后自动刷新列表.....');
                                setTimeout(function () {
                                    HideWaiting();
                                    //加载列表
                                    GetAndSetListResult(varKeyValue);
                                }, 2000);
                            } else {
                                $("#lb_NoticeMsg").text(showString + '操作失败，请联系管理员处理!');
                            }
                        }
                    });

                } else {
                    $("#lb_NoticeMsg").show().hide();
                }
                HideWaiting();
            }

            HideWaiting();
        }
    </script>
