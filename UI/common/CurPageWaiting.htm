
<script language="javascript">

    function ShowWaitingDiv(){
        document.getElementById("divWaiting").style.display="";
    }
    function HideWaitingDiv(){
        document.getElementById("divWaiting").style.display="none";
    }
</script>

 <div runat="server" id="divWaiting" style="display:none;float:left;z-index:100;position:absolute;text-align:center; 
	width:100%;height:100%;filter:alpha(opacity=40);background-color:#707070;">
    <font color="red" >Loading.......</font>
</div>

<!--
页面功能：通过在当前页面显示和隐藏遮罩层来完成系统后台处理的前台效果，提高用户体验
使用说明
1、该页面可应用在所有aspx页面中，在aspx页面中的<body>下增加代码：#include   file= "../common/CurPageWaiting.htm
2、页面加载时或者页面中某事件触发时调用方法ShowWaitingDiv()；
   如，在Page_Load中调用，或者在按钮点击时间中调用
3、在假面加载完成时调用方法HideWaitingDiv()；如在Page_LoadComplete方法中
   如：Page.ClientScript.RegisterStartupScript(typeof(Page), "hideWaitingDiv", "<script language=\"javascript\">HideWaitingDiv();</script>");
   

劣势：必须在后台代码中增加相应代码
优势：灵活配置，可在某一个页面中的多个事件触发则没有效果。
-->
