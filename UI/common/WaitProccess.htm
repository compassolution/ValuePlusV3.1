<!--
页面功能：通过前一个页面的onbeforeunload事件来显示遮罩层来完成页面切换的前台效果，提高用户体验
使用说明
1、该页面可应用在所有aspx页面中，在aspx页面中的<body>下增加代码：#include   file= "../common/WaitProccess.htm

优势：使用简单，不用在后台代码中增加任何代码
劣势：
    1、如某个页面未增加此页面，则下一个页面加载时不会出现遮罩层
    2、如果需要在某一个页面中的多个事件触发则没有效果。
-->
